    <section class="act-coffin-view" id="actCoffinView">

            </div>

            <!-- Hold Gauge Console -->
            <div class="hold-gauge-panel">

            </div>

          </div>

          <!-- Coffin Sliding Solid Wood Lid -->

    <!-- ==========================================================================
         ACT 2: GOTHIC BURNED PARCHMENT (STANDALONE IMMERSIVE LETTER)
         ========================================================================== -->
    <article class="act-parchment-letter" id="actParchmentLetter">

      <h1 class="letter-main-title" id="letterHeadline"></h1>

      <!-- 3D Flip Polaroid Photo Album -->

        <div class="photo-flip-card" id="photoFlipCard">
          <div class="photo-flip-inner">

            <div class="photo-card-side photo-back">

          </div>
        </div>
        <div class="photo-flip-hint">✦ TAP PHOTO TO FLIP MEMORY ✦</div>

        <div class="photo-nav-rack" id="photoNavRack">
          <button class="photo-nav-btn" id="prevPhotoBtn">‹</button>
          <span class="photo-page-num" id="photoPageIndicator">1 / 1</span>
          <button class="photo-nav-btn" id="nextPhotoBtn">›</button>
        </div>
      </div>

      <!-- Typewriter Body -->
      <div class="letter-body-text" id="letterBodyText">
        <span id="typewriterText"></span><span class="typewriter-cursor" id="typewriterCursor"></span>
      </div>

      <div class="letter-closing-line" id="letterClosing"></div>
      <div class="letter-signature-script" id="letterSignature"></div>

      <!-- Exclusive Blood Oath Seal Interaction -->
      <div class="blood-pact-station">
        <div class="blood-pact-title" id="bloodOathTitle">✦ SEAL OUR BLOOD PACT ✦</div>
        <div class="blood-pact-hint" id="bloodOathHint">PRESS THUMB TO LEAVE AN ETERNAL MARK</div>
        <button class="blood-stamp-press" id="bloodStampPress">PRESS THUMB</button>
        <div class="blood-stamp-result" id="bloodStampResult"></div>
      </div>

      <!-- Gravestone Scratch-Off Vault -->
      <section class="scratch-tomb-vault" id="scratchSection">
        <div class="scratch-vault-label" id="scratchHintText"></div>
        <div class="scratch-vault-frame">
          <div class="scratch-secret-text" id="scratchSecretReveal"></div>
          <canvas class="scratch-canvas-layer" id="scratchCanvas"></canvas>
        </div>
      </section>

      <!-- Runaway Mechanical Question -->
      <section class="runaway-gate-section" id="runawaySection">
        <div class="runaway-gate-question" id="runawayQuestion"></div>
        <div class="runaway-gate-buttons">
          <button class="btn-gate-yes" id="btnYes">YES, FOREVER ✦</button>
          <button class="btn-gate-no" id="btnNo">NEVER</button>
        </div>
        <div class="gate-success-banner" id="gateSuccessBanner"></div>
      </section>

    </article>

  </main>

  <script src="data.js?v=gothic_casket_3.0.0"></script>
  <script>
    /* ==========================================================================
       GOTHIC ACOUSTIC & PHYSICAL FEEDBACK ENGINE
       ========================================================================== */
    const SoundEngine = {
      ctx: null,
      getCtx() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      },
      playSlide() {
        try {
          const ctx = this.getCtx();
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(80, now);
          osc.frequency.exponentialRampToValueAtTime(30, now + 0.85);

          gain.gain.setValueAtTime(0.01, now);
          gain.gain.linearRampToValueAtTime(0.35, now + 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.85);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.85);
          this.haptic(50);
        } catch(e) {}
      },
      playBell() {
        try {
          const ctx = this.getCtx();
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(261.63, now + 2.5);

          gain.gain.setValueAtTime(0.45, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 2.5);

          // 55Hz Low-Frequency Impulse
          const sub = ctx.createOscillator();
          const subGain = ctx.createGain();
          sub.type = 'sine';
          sub.frequency.setValueAtTime(55, now);
          subGain.gain.setValueAtTime(0.9, now);
          subGain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

          sub.connect(subGain);
          subGain.connect(ctx.destination);
          sub.start(now);
          sub.stop(now + 0.3);

          this.haptic([80, 40, 120]);
        } catch(e) {}
      },
      haptic(pattern) {
        if ('vibrate' in navigator) {
          try { navigator.vibrate(pattern); } catch(e) {}
        }
      }
    };

    /* Atmospheric Particles */
    const canvas = document.getElementById('particleCanvas');
    const pCtx = canvas.getContext('2d');
    let particles = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    for (let i = 0; i < 28; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2 + 0.8,
        vy: -(Math.random() * 0.4 + 0.15),
        vx: (Math.random() - 0.5) * 0.25,
        alpha: Math.random() * 0.5 + 0.2,
        color: Math.random() > 0.4 ? '#ff2a5f' : '#bfa882'
      });
    }

    function renderParticles() {
      pCtx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.y += p.vy;
        p.x += p.vx;
        if (p.y < 0) {
          p.y = canvas.height + 10;
          p.x = Math.random() * canvas.width;
        }
        pCtx.save();
        pCtx.globalAlpha = p.alpha;
        pCtx.fillStyle = p.color;
        pCtx.beginPath();
        pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        pCtx.fill();
        pCtx.restore();
      });
      requestAnimationFrame(renderParticles);
    }
    renderParticles();

    /* Burst Stage Effects (Flying Petals & Stars) */
    function triggerBurst(originX, originY) {
      const stage = document.getElementById('burstStage');
      const icons = ['🥀', '✨', '🖤', '🌹', '🩸', '✨'];
      for (let i = 0; i < 30; i++) {
        const el = document.createElement('div');
        el.className = 'burst-particle';
        el.innerText = icons[Math.floor(Math.random() * icons.length)];
        el.style.left = originX + 'px';
        el.style.top = originY + 'px';
        el.style.fontSize = (Math.random() * 16 + 14) + 'px';
        stage.appendChild(el);

        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * 140 + 70;
        const destX = Math.cos(angle) * dist;
        const destY = Math.sin(angle) * dist - 60;
        const rot = (Math.random() - 0.5) * 120;

        el.animate([
          { opacity: 0, transform: 'translate(0, 0) scale(0.3)' },
          { opacity: 1, transform: `translate(${destX * 0.5}px, ${destY * 0.5}px) scale(1.3) rotate(${rot * 0.5}deg)`, offset: 0.4 },
          { opacity: 0, transform: `translate(${destX}px, ${destY}px) scale(0.8) rotate(${rot}deg)` }
        ], {
          duration: 1000,
          easing: 'cubic-bezier(0.15, 0.85, 0.35, 1.2)',
          fill: 'forwards'
        });

        setTimeout(() => el.remove(), 1050);
      }
    }

    /* Core Controller */
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Data Ingestion
      document.getElementById('statusDate').innerText = letterData.dateText || "OCTOBER 31, 2026";
      document.getElementById('letterDate').innerText = letterData.dateText || "OCTOBER 31, 2026";
      document.getElementById('headlineHero').innerText = letterData.headline || "TILL DEATH DO US PART";
      document.getElementById('letterHeadline').innerText = letterData.headline || "TILL DEATH DO US PART";
      document.getElementById('letterSubHeadline').innerText = letterData.subHeadline || "";
      document.getElementById('letterSalutation').innerText = letterData.salutation || "To My Eternal Beloved,";
      document.getElementById('letterClosing').innerText = letterData.closing || "";
      document.getElementById('letterSignature').innerText = letterData.signature || "";

      document.getElementById('bloodOathTitle').innerText = letterData.bloodOathTitle || "✦ SEAL OUR BLOOD PACT ✦";
      document.getElementById('bloodOathHint').innerText = letterData.bloodOathHint || "PRESS THUMB TO LEAVE AN ETERNAL MARK";

      if (letterData.fontType) {
        document.getElementById('letterBodyText').style.fontFamily = `"${letterData.fontType}", Georgia, serif`;
      }

      // 2. Audio Control
      const bgAudio = document.getElementById('bgAudio');
      const audioBtn = document.getElementById('audioToggleBtn');
      let isPlayingAudio = false;

      if (letterData.audioUrl && letterData.audioUrl.trim() !== "") {
        bgAudio.src = letterData.audioUrl;
      }

      function toggleAudio() {
        if (isPlayingAudio) {
          bgAudio.pause();
          audioBtn.classList.remove('is-playing');
          isPlayingAudio = false;
        } else {
          SoundEngine.getCtx();
          if (letterData.audioUrl) {
            bgAudio.play().then(() => {
              audioBtn.classList.add('is-playing');
              isPlayingAudio = true;
            }).catch(() => {});
          }
        }
      }
      audioBtn.addEventListener('click', toggleAudio);

      // 3. Passcode Gate
      const overlay = document.getElementById('passcodeOverlay');
      if (!letterData.passcode) {
        overlay.classList.add('is-unlocked');
      } else {
        const inputs = document.querySelectorAll('.passcode-digit');
        const errEl = document.getElementById('passcodeError');
        inputs.forEach((input, idx) => {
          input.addEventListener('input', (e) => {
            if (e.target.value.length === 1 && idx < inputs.length - 1) inputs[idx + 1].focus();
            checkPin();
          });
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !e.target.value && idx > 0) inputs[idx - 1].focus();
          });
        });
        function checkPin() {
          const val = Array.from(inputs).map(i => i.value).join('');
          if (val.length === 4) {
            if (val === letterData.passcode) {
              SoundEngine.playSlide();
              overlay.classList.add('is-unlocked');
              if (letterData.audioUrl && !isPlayingAudio) {
                bgAudio.play().then(() => {
                  audioBtn.classList.add('is-playing');
                  isPlayingAudio = true;
                }).catch(() => {});
              }
            } else {
              errEl.innerText = "THE CIPHER REJECTS YOUR TOUCH";
              SoundEngine.haptic([100, 50, 100]);
              inputs.forEach(i => i.value = '');
              inputs[0].focus();
            }
          }
        }
      }

      // 4. Coffin Lid Click
      const coffin = document.getElementById('coffinCasketBody');
      const coffinLid = document.getElementById('coffinLid');
      coffinLid.addEventListener('click', (e) => {
        SoundEngine.playSlide();
        coffin.classList.add('is-opened');
        triggerBurst(e.clientX || window.innerWidth / 2, e.clientY || window.innerHeight * 0.45);
        if (letterData.audioUrl && !isPlayingAudio) {
          bgAudio.play().then(() => {
            audioBtn.classList.add('is-playing');
            isPlayingAudio = true;
          }).catch(() => {});
        }
      });

      // 5. Holding Skeleton Hand
      const handRight = document.getElementById('handRightBtn');
      const fillBar = document.getElementById('holdFillBar');
      const readLetterBtn = document.getElementById('readLetterBtn');
      let holdTimer = null;
      let holdProgress = 0;
      let hasClasped = false;

      function startHold(e) {
        if (hasClasped || !coffin.classList.contains('is-opened')) return;
        e.preventDefault();
        SoundEngine.getCtx();
        holdProgress = 0;
        fillBar.style.width = '0%';

        holdTimer = setInterval(() => {
          holdProgress += 5;
          fillBar.style.width = holdProgress + '%';
          if (holdProgress % 20 === 0) SoundEngine.haptic(15);

          if (holdProgress >= 100) {
            clearInterval(holdTimer);
            claspHands();
          }
        }, 90);
      }

      function cancelHold() {
        if (hasClasped) return;
        clearInterval(holdTimer);
        holdProgress = 0;
        fillBar.style.width = '0%';
      }

      function claspHands() {
        hasClasped = true;
        coffin.classList.add('is-clasped');
        SoundEngine.playBell();
        triggerBurst(window.innerWidth / 2, window.innerHeight * 0.45);

        setTimeout(() => {
          readLetterBtn.style.display = 'inline-block';
        }, 1200);
      }

      handRight.addEventListener('mousedown', startHold);
      window.addEventListener('mouseup', cancelHold);
      handRight.addEventListener('touchstart', startHold, { passive: false });
      window.addEventListener('touchend', cancelHold);

      // 6. Transition: Act 1 to Act 2
      const actCoffin = document.getElementById('actCoffinView');
      const actLetter = document.getElementById('actParchmentLetter');

      readLetterBtn.addEventListener('click', (e) => {
        triggerBurst(e.clientX || window.innerWidth / 2, e.clientY || window.innerHeight * 0.5);
        SoundEngine.playSlide();
        actCoffin.classList.add('is-exited');

        setTimeout(() => {
          actLetter.classList.add('is-active');
          if (letterData.enableScratch) initTombScratch();
          startTypewriter(letterData.body);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }, 650);
      });

      // 7. 3D Polaroid Photo Album
      const photoCard = document.getElementById('photoFlipCard');
      const frontImg = document.getElementById('frontPhotoImg');
      const backCaption = document.getElementById('backCaptionText');
      const navRack = document.getElementById('photoNavRack');
      const pageIndicator = document.getElementById('photoPageIndicator');
      const prevBtn = document.getElementById('prevPhotoBtn');
      const nextBtn = document.getElementById('nextPhotoBtn');

      let currentPhotoIdx = 0;
      const photoList = letterData.photos || [];

      if (photoList.length > 0) {
        function renderPhoto(idx) {
          photoCard.classList.remove('is-flipped');
          frontImg.src = photoList[idx].url;
          backCaption.innerText = photoList[idx].caption || "";
          pageIndicator.innerText = `${idx + 1} / ${photoList.length}`;
        }
        renderPhoto(0);

        photoCard.addEventListener('click', (e) => {
          e.stopPropagation();
          photoCard.classList.toggle('is-flipped');
          SoundEngine.haptic(25);
        });

        if (photoList.length <= 1) {
          navRack.style.display = 'none';
        } else {
          prevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            currentPhotoIdx = (currentPhotoIdx - 1 + photoList.length) % photoList.length;
            renderPhoto(currentPhotoIdx);
          });
          nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            currentPhotoIdx = (currentPhotoIdx + 1) % photoList.length;
            renderPhoto(currentPhotoIdx);
          });
        }
      } else {
        document.getElementById('photoFlipStage').style.display = 'none';
      }

      // 8. Smart Typewriter
      let typewriterTimer = null;
      let isDoneTyping = false;
      const textEl = document.getElementById('typewriterText');
      const cursor = document.getElementById('typewriterCursor');

      function startTypewriter(str) {
        if (!str) return;
        let idx = 0;
        const speed = str.length > 400 ? 12 : 28;
        typewriterTimer = setInterval(() => {
          if (idx < str.length) {
            textEl.innerText += str.charAt(idx);
            idx++;
          } else {
            finishTyping(str);
          }
        }, speed);

        document.addEventListener('click', function skip() {
          if (!isDoneTyping) {
            finishTyping(str);
            document.removeEventListener('click', skip);
          }
        });
      }

      function finishTyping(str) {
        clearInterval(typewriterTimer);
        textEl.innerText = str;
        isDoneTyping = true;
        cursor.style.display = 'none';
      }

      // 9. Exclusive Surprise: Blood Oath Press
      const bloodBtn = document.getElementById('bloodStampPress');
      const bloodResult = document.getElementById('bloodStampResult');
      bloodBtn.addEventListener('click', (e) => {
        SoundEngine.playBell();
        bloodBtn.style.display = 'none';
        bloodResult.innerText = letterData.bloodOathSuccess || "✦ Bound by Blood & Bone ♡ Forever Sealed ✦";
        bloodResult.style.display = 'block';
        triggerBurst(e.clientX || window.innerWidth / 2, e.clientY || window.innerHeight * 0.7);
      });

      // 10. Gravestone Scratch-Off
      function initTombScratch() {
        const scratchSec = document.getElementById('scratchSection');
        if (!letterData.enableScratch) {
          scratchSec.style.display = 'none';
          return;
        }

        document.getElementById('scratchHintText').innerText = letterData.scratchHint;
        document.getElementById('scratchSecretReveal').innerText = letterData.scratchSecret;

        const sCanvas = document.getElementById('scratchCanvas');
        const sCtx = sCanvas.getContext('2d');
        const frame = sCanvas.parentElement;
        const w = frame.clientWidth || 320;
        const h = frame.clientHeight || 84;
        sCanvas.width = w;
        sCanvas.height = h;

        const grad = sCtx.createLinearGradient(0, 0, w, h);
        grad.addColorStop(0, '#2e2638');
        grad.addColorStop(0.5, '#453954');
        grad.addColorStop(1, '#1e1826');
        sCtx.fillStyle = grad;
        sCtx.fillRect(0, 0, w, h);

        sCtx.strokeStyle = '#ff3366';
        sCtx.lineWidth = 1.5;
        sCtx.strokeRect(10, 8, w - 20, h - 16);

        sCtx.fillStyle = '#ffccd5';
        sCtx.font = 'bold 10px Montserrat, sans-serif';
        sCtx.textAlign = 'center';
        sCtx.textBaseline = 'middle';
        sCtx.fillText('✦ SCRATCH GRAVESTONE TO REVEAL ✦', w / 2, h / 2);

        let isScratching = false;
        function scratch(e) {
          if (!isScratching) return;
          const rect = sCanvas.getBoundingClientRect();
          const cx = e.touches ? e.touches[0].clientX : e.clientX;
          const cy = e.touches ? e.touches[0].clientY : e.clientY;
          sCtx.globalCompositeOperation = 'destination-out';
          sCtx.beginPath();
          sCtx.arc(cx - rect.left, cy - rect.top, 18, 0, Math.PI * 2);
          sCtx.fill();
          SoundEngine.haptic(10);
        }

        sCanvas.addEventListener('mousedown', () => isScratching = true);
        window.addEventListener('mouseup', () => isScratching = false);
        sCanvas.addEventListener('mousemove', scratch);
        sCanvas.addEventListener('touchstart', (e) => { isScratching = true; scratch(e); }, { passive: true });
        window.addEventListener('touchend', () => isScratching = false);
        sCanvas.addEventListener('touchmove', scratch, { passive: true });
      }

      // 11. Runaway Gate
      const runawaySec = document.getElementById('runawaySection');
      if (letterData.enableRunaway) {
        document.getElementById('runawayQuestion').innerText = letterData.runawayQuestion;
        const btnYes = document.getElementById('btnYes');
        const btnNo = document.getElementById('btnNo');
        const banner = document.getElementById('gateSuccessBanner');

        function evade(e) {
          e.preventDefault();
          const x = (Math.random() - 0.5) * 180;
          const y = (Math.random() - 0.5) * 80;
          btnNo.style.transform = `translate(${x}px, ${y}px)`;
          SoundEngine.haptic(20);
        }

        btnNo.addEventListener('mouseover', evade);
        btnNo.addEventListener('touchstart', evade);

        btnYes.addEventListener('click', (e) => {
          SoundEngine.playBell();
          btnNo.style.display = 'none';
          btnYes.style.display = 'none';
          document.getElementById('runawayQuestion').style.display = 'none';
          banner.innerText = letterData.runawaySuccessMessage;
          banner.style.display = 'block';
          triggerBurst(e.clientX || window.innerWidth / 2, e.clientY || window.innerHeight * 0.7);
        });
      } else {
        runawaySec.style.display = 'none';
      }
    });
  </script>
</body>
</html>
