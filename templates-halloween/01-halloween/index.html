<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Till Death Do Us Part</title>

  <!-- Google Typography Suite -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,400;1,600&family=Montserrat:wght@500;700;800&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">

</head>
<body>

  <!-- Atmospheric Night Particles Canvas -->
  <canvas id="particleCanvas" class="particle-canvas"></canvas>

  <!-- Audio System (Supports both Custom MP3 & Synthetic Gothic Organ fallback) -->
  <audio id="bgAudio" loop preload="auto"></audio>
  <button id="audioToggleBtn" class="audio-ctrl-btn" title="Toggle Music">🎵</button>

  <!-- Passcode Overlay -->
  <div class="passcode-overlay" id="passcodeOverlay">
    <div class="passcode-box">
      <div class="passcode-title">ENTER 4-DIGIT CRYPT CIPHER</div>
      <div class="passcode-inputs">
        <input type="password" maxlength="1" class="passcode-digit" inputmode="numeric" autofocus />
        <input type="password" maxlength="1" class="passcode-digit" inputmode="numeric" />
        <input type="password" maxlength="1" class="passcode-digit" inputmode="numeric" />
        <input type="password" maxlength="1" class="passcode-digit" inputmode="numeric" />
      </div>
      <div class="passcode-error" id="passcodeError"></div>
    </div>
  </div>

  <main class="app-stage">

    <!-- ==========================================================================
         ACT 1: THE COFFIN VOW (BALANCED, IMMERSIVE, SINGLE-VIEWPORT)
         ========================================================================== -->
    <section class="act-coffin" id="actCoffin">
      
      <div class="coffin-meta-header">
        <div class="coffin-meta-sub" id="statusDate">ALL HALLOWS' EVE, 2026</div>
        <h1 class="coffin-meta-title" id="headlineHero">TILL DEATH DO US PART</h1>
      </div>

      <!-- Coffin Physical Casket -->
      <div class="coffin-casket-viewport" id="coffinViewport">
        <div class="coffin-outer-shell">
          <div class="coffin-wood-bezel"></div>

          <!-- Deep Tufted Velvet Interior -->
          <div class="coffin-velvet-interior">
            
            <div class="hands-arena">
              <!-- Left Skeletal Hand (Anatomical Depth & Joints) -->
              <svg class="skeletal-arm arm-left" viewBox="0 0 120 180" fill="none">
                <defs>
                  <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="60%" stop-color="#e3dfd5"/>
                    <stop offset="100%" stop-color="#8a8377"/>
                  </linearGradient>
                  <filter id="boneShad" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.8"/>
                  </filter>
                </defs>
                <!-- Forearm bones -->
                <path d="M 46 175 L 46 122 M 62 175 L 62 122" stroke="url(#boneGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#boneShad)"/>
                <!-- Carpal joint cluster -->
                <ellipse cx="54" cy="116" rx="16" ry="7" fill="#201b29" stroke="url(#boneGrad)" stroke-width="2.5" filter="url(#boneShad)"/>
                <!-- Metacarpals & Phalanges -->
                <path d="M 42 110 C 32 90, 22 70, 16 52 C 14 44, 20 36, 28 40 C 35 45, 41 74, 45 102" stroke="url(#boneGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#boneShad)"/>
                <path d="M 50 108 C 48 76, 44 45, 48 18 C 49 11, 57 11, 60 18 C 63 45, 57 82, 55 108" stroke="url(#boneGrad)" stroke-width="3.8" stroke-linecap="round" filter="url(#boneShad)"/>
                <path d="M 58 108 C 62 80, 66 48, 75 28 C 78 22, 85 23, 85 30 C 83 52, 73 82, 65 108" stroke="url(#boneGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#boneShad)"/>
                <path d="M 64 110 C 74 92, 86 74, 98 62 C 103 57, 109 62, 105 70 C 94 88, 80 106, 70 114" stroke="url(#boneGrad)" stroke-width="3.2" stroke-linecap="round" filter="url(#boneShad)"/>
                <!-- Thumb -->
                <path d="M 40 114 C 28 110, 12 114, 6 122 C 2 127, 6 133, 14 131 C 26 126, 36 120, 40 118" stroke="url(#boneGrad)" stroke-width="3.2" stroke-linecap="round" filter="url(#boneShad)"/>
              </svg>

              <!-- Blooming Blood Rose -->
              <svg class="rose-bloom-svg" viewBox="0 0 100 100" fill="none">
                <circle cx="50" cy="50" r="22" fill="#700416"/>
                <path d="M 50 25 C 34 25 24 38 24 52 C 24 68 38 78 50 85 C 62 78 76 68 76 52 C 76 38 66 25 50 25 Z" fill="#a80724"/>
                <path d="M 38 45 C 44 36 56 36 62 45 C 65 54 58 64 50 68 C 42 64 35 54 38 45 Z" fill="#e6194b"/>
                <path d="M 45 49 C 48 45 53 45 55 49 C 57 53 53 58 50 60 C 47 58 43 53 45 49 Z" fill="#ff4d79"/>
                <!-- Vine Thorns -->
                <path d="M 15 65 Q 30 55 50 55 Q 70 55 85 65" stroke="#1d401a" stroke-width="3" stroke-linecap="round"/>
                <path d="M 28 58 L 24 50 M 72 58 L 76 50" stroke="#1d401a" stroke-width="2" stroke-linecap="round"/>
              </svg>

              <!-- Right Skeletal Hand -->
              <svg class="skeletal-arm arm-right arm-pulse" id="handRightBtn" viewBox="0 0 120 180" fill="none">
                <path d="M 74 175 L 74 122 M 58 175 L 58 122" stroke="url(#boneGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#boneShad)"/>
                <ellipse cx="66" cy="116" rx="16" ry="7" fill="#201b29" stroke="url(#boneGrad)" stroke-width="2.5" filter="url(#boneShad)"/>
                <path d="M 78 110 C 88 90, 98 70, 104 52 C 106 44, 100 36, 92 40 C 85 45, 79 74, 75 102" stroke="url(#boneGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#boneShad)"/>
                <path d="M 70 108 C 72 76, 76 45, 72 18 C 71 11, 63 11, 60 18 C 57 45, 63 82, 65 108" stroke="url(#boneGrad)" stroke-width="3.8" stroke-linecap="round" filter="url(#boneShad)"/>
                <path d="M 62 108 C 58 80, 54 48, 45 28 C 42 22, 35 23, 35 30 C 37 52, 47 82, 55 108" stroke="url(#boneGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#boneShad)"/>
                <path d="M 56 110 C 46 92, 34 74, 22 62 C 17 57, 11 62, 15 70 C 26 88, 40 106, 50 114" stroke="url(#boneGrad)" stroke-width="3.2" stroke-linecap="round" filter="url(#boneShad)"/>
                <path d="M 80 114 C 92 110, 108 114, 114 122 C 118 127, 114 133, 106 131 C 94 126, 84 120, 80 118" stroke="url(#boneGrad)" stroke-width="3.2" stroke-linecap="round" filter="url(#boneShad)"/>
              </svg>
            </div>

            <!-- Hold Gauge Console (Clean, centered, unblocked) -->
            <div class="hold-gauge-box">
              <div class="hold-gauge-track">
                <div class="hold-gauge-fill" id="holdGaugeFill"></div>
              </div>
              <span class="hold-gauge-text">✦ HOLD HAND TO SEAL ETERNAL PACT ✦</span>
            </div>

          </div>

          <!-- Sliding Coffin Lid -->
          <div class="coffin-lid-panel" id="coffinLid">
            <div class="lid-inner-crevice">
              <div class="gothic-wax-seal">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="#ffffff">
                  <path d="M10 2 H14 V7 H19 V11 H14 V22 H10 V11 H5 V7 H10 Z"/>
                </svg>
              </div>
              <div class="lid-tap-hint">✦ TAP CROSS TO UNSEAL ✦</div>
            </div>
          </div>

        </div>
      </div>

      <!-- Proceed Button (Emerges smoothly after clasping) -->
      <button class="proceed-act-btn" id="proceedActBtn">✦ READ OUR ETERNAL LETTER ✦</button>

    </section>

    <!-- ==========================================================================
         ACT 2: GOTHIC PARCHMENT LETTER (STANDALONE SCREEN, IMMERSIVE LUXURY)
         ========================================================================== -->
    <article class="act-letter" id="actLetter">
      
      <div class="letter-top-date" id="letterDate"></div>
      <h1 class="letter-headline" id="letterHeadline"></h1>
      <div class="letter-subheadline" id="letterSubHeadline"></div>

      <!-- Wax Salutation Tape -->
      <div class="letter-salutation-wrap">
        <span class="letter-salutation-text" id="letterSalutation"></span>
      </div>

      <!-- 3D Flip Polaroid Photo Album -->
      <div class="photo-album-box" id="photoAlbumBox">
        <div class="photo-flip-casket" id="photoFlipCasket">
          <div class="photo-flip-inner">
            <div class="photo-side photo-front">
              <img id="frontPhotoImg" src="" alt="Memory Photo" />
            </div>
            <div class="photo-side photo-back">
              <p class="photo-back-caption" id="backCaptionText"></p>
            </div>
          </div>
        </div>
        <div class="photo-flip-tip">✦ TAP PHOTO TO FLIP MEMORY ✦</div>

        <div class="photo-nav-rack" id="photoNavRack">
          <button class="photo-nav-btn" id="prevPhotoBtn">‹</button>
          <span class="photo-page-num" id="photoPageIndicator">1 / 1</span>
          <button class="photo-nav-btn" id="nextPhotoBtn">›</button>
        </div>
      </div>

      <!-- Typewriter Body -->
      <div class="letter-body-area" id="letterBodyArea">
        <span id="typewriterText"></span><span class="gothic-typewriter-cursor" id="typewriterCursor"></span>
      </div>

      <div class="letter-closing-line" id="letterClosing"></div>
      <div class="letter-signature-script" id="letterSignature"></div>

      <!-- Exclusive Halloween Surprise Interaction: Blood Pact Seal -->
      <div class="blood-pact-interactive-box">
        <div class="blood-pact-title">✦ SEAL THE BLOOD PACT FOREVER ✦</div>
        <button class="blood-stamp-btn" id="bloodStampBtn">STAMP WITH THUMB</button>
        <div class="blood-pact-result" id="bloodPactResult">Eternal Vow Sealed in Blood ♡</div>
      </div>

      <!-- Gravestone Scratch-Off Vault -->
      <section class="scratch-gravestone-area" id="scratchSection">
        <div class="scratch-tomb-label" id="scratchHintText"></div>
        <div class="scratch-tomb-frame">
          <div class="scratch-tomb-secret" id="scratchSecretReveal"></div>
          <canvas class="scratch-tomb-canvas" id="scratchCanvas"></canvas>
        </div>
      </section>

      <!-- Runaway Mechanical Question -->
      <section class="runaway-tomb-section" id="runawaySection">
        <div class="runaway-tomb-question" id="runawayQuestion"></div>
        <div class="runaway-tomb-btns">
          <button class="btn-tomb-yes" id="btnYes">YES, FOREVER ✦</button>
          <button class="btn-tomb-no" id="btnNo">NEVER</button>
        </div>
        <div class="tomb-success-banner" id="tombSuccessBanner"></div>
      </section>

    </article>

  </main>

  <script src="data.js?v=gothic_casket_2.0.0"></script>
  <script>
    /* ==========================================================================
       GOTHIC ACOUSTIC & HAPTIC ENGINE
       ========================================================================== */
    const SoundBox = {
      ctx: null,
      getCtx() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      },
      // Heavy Oak Hinge Slide
      playCoffinSlide() {
        try {
          const ctx = this.getCtx();
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(85, now);
          osc.frequency.exponentialRampToValueAtTime(30, now + 0.85);

          gain.gain.setValueAtTime(0.01, now);
          gain.gain.linearRampToValueAtTime(0.35, now + 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.85);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.85);
          this.haptic(50);
        } catch(e) {}
      },
      // Cathedral Toll & Sub-Bass Thud (iOS & Android)
      playBellToll() {
        try {
          const ctx = this.getCtx();
          const now = ctx.currentTime;

          // Cathedral Chime
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now); // C5
          osc.frequency.exponentialRampToValueAtTime(261.63, now + 2.5);

          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 2.5);

          // 55Hz Tactile Impulse
          const sub = ctx.createOscillator();
          const subGain = ctx.createGain();
          sub.type = 'sine';
          sub.frequency.setValueAtTime(55, now);
          subGain.gain.setValueAtTime(0.9, now);
          subGain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

          sub.connect(subGain);
          subGain.connect(ctx.destination);
          sub.start(now);
          sub.stop(now + 0.3);

          this.haptic([80, 40, 120]);
        } catch(e) {}
      },
      haptic(pattern) {
        if ('vibrate' in navigator) {
          try { navigator.vibrate(pattern); } catch(e) {}
        }
      }
    };

    /* Particle Fog & Embers Engine */
    const canvas = document.getElementById('particleCanvas');
    const pCtx = canvas.getContext('2d');
    let particles = [];
    let bursts = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    for (let i = 0; i < 28; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2 + 0.8,
        vy: -(Math.random() * 0.4 + 0.15),
        vx: (Math.random() - 0.5) * 0.25,
        alpha: Math.random() * 0.5 + 0.2,
        color: Math.random() > 0.4 ? '#ff2a5f' : '#bfa882'
      });
    }

    function createBurst(x, y, count = 35) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const vel = Math.random() * 6 + 2;
        bursts.push({
          x, y,
          vx: Math.cos(angle) * vel,
          vy: Math.sin(angle) * vel - 1,
          size: Math.random() * 4 + 2,
          color: Math.random() > 0.3 ? '#ff1e56' : '#d4af37',
          life: 1,
          decay: Math.random() * 0.02 + 0.015
        });
      }
    }

    function renderParticles() {
      pCtx.clearRect(0, 0, canvas.width, canvas.height);
      
      particles.forEach(p => {
        p.y += p.vy;
        p.x += p.vx;
        if (p.y < 0) {
          p.y = canvas.height + 10;
          p.x = Math.random() * canvas.width;
        }
        pCtx.save();
        pCtx.globalAlpha = p.alpha;
        pCtx.fillStyle = p.color;
        pCtx.beginPath();
        pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        pCtx.fill();
        pCtx.restore();
      });

      for (let i = bursts.length - 1; i >= 0; i--) {
        const b = bursts[i];
        b.x += b.vx;
        b.y += b.vy;
        b.vy += 0.06;
        b.life -= b.decay;

        if (b.life <= 0) {
          bursts.splice(i, 1);
          continue;
        }
        pCtx.save();
        pCtx.globalAlpha = b.life;
        pCtx.fillStyle = b.color;
        pCtx.beginPath();
        pCtx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
        pCtx.fill();
        pCtx.restore();
      }
      requestAnimationFrame(renderParticles);
    }
    renderParticles();

    /* App Controller */
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Data Ingestion
      document.getElementById('statusDate').innerText = letterData.dateText || "OCTOBER 31, 2026";
      document.getElementById('letterDate').innerText = letterData.dateText || "OCTOBER 31, 2026";
      document.getElementById('headlineHero').innerText = letterData.headline || "TILL DEATH DO US PART";
      document.getElementById('letterHeadline').innerText = letterData.headline || "TILL DEATH DO US PART";
      document.getElementById('letterSubHeadline').innerText = letterData.subHeadline || "";
      document.getElementById('letterSalutation').innerText = letterData.salutation || "My Beloved,";
      document.getElementById('letterClosing').innerText = letterData.closing || "";
      document.getElementById('letterSignature').innerText = letterData.signature || "";

      if (letterData.fontType) {
        document.getElementById('letterBodyArea').style.fontFamily = `"${letterData.fontType}", Georgia, serif`;
      }

      // 2. Audio Setup
      const bgAudio = document.getElementById('bgAudio');
      const audioBtn = document.getElementById('audioToggleBtn');
      let isPlayingAudio = false;

      if (letterData.audioUrl && letterData.audioUrl.trim() !== "") {
        bgAudio.src = letterData.audioUrl;
      }

      function toggleAudio() {
        if (isPlayingAudio) {
          bgAudio.pause();
          audioBtn.innerText = '🔇';
          isPlayingAudio = false;
        } else {
          SoundBox.getCtx();
          if (letterData.audioUrl) {
            bgAudio.play().then(() => {
              audioBtn.innerText = '🎵';
              isPlayingAudio = true;
            }).catch(() => {});
          }
        }
      }
      audioBtn.addEventListener('click', toggleAudio);

      // 3. Passcode Gate
      const overlay = document.getElementById('passcodeOverlay');
      if (!letterData.passcode) {
        overlay.classList.add('is-unlocked');
      } else {
        const inputs = document.querySelectorAll('.passcode-digit');
        const errEl = document.getElementById('passcodeError');
        inputs.forEach((input, idx) => {
          input.addEventListener('input', (e) => {
            if (e.target.value.length === 1 && idx < inputs.length - 1) inputs[idx + 1].focus();
            checkPin();
          });
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !e.target.value && idx > 0) inputs[idx - 1].focus();
          });
        });
        function checkPin() {
          const val = Array.from(inputs).map(i => i.value).join('');
          if (val.length === 4) {
            if (val === letterData.passcode) {
              SoundBox.playCoffinSlide();
              overlay.classList.add('is-unlocked');
              if (letterData.audioUrl && !isPlayingAudio) {
                bgAudio.play().then(() => isPlayingAudio = true).catch(() => {});
              }
            } else {
              errEl.innerText = "THE CIPHER REJECTS YOUR TOUCH";
              SoundBox.haptic([100, 50, 100]);
              inputs.forEach(i => i.value = '');
              inputs[0].focus();
            }
          }
        }
      }

      // 4. Coffin Lid Click
      const coffin = document.getElementById('coffinViewport');
      const coffinLid = document.getElementById('coffinLid');
      coffinLid.addEventListener('click', () => {
        SoundBox.playCoffinSlide();
        coffin.classList.add('is-opened');
        if (letterData.audioUrl && !isPlayingAudio) {
          bgAudio.play().then(() => isPlayingAudio = true).catch(() => {});
        }
      });

      // 5. Holding Skeleton Hand (1.8s)
      const handRight = document.getElementById('handRightBtn');
      const gaugeFill = document.getElementById('holdGaugeFill');
      const proceedBtn = document.getElementById('proceedActBtn');
      let holdTimer = null;
      let holdProgress = 0;
      let hasClasped = false;

      function startHold(e) {
        if (hasClasped || !coffin.classList.contains('is-opened')) return;
        e.preventDefault();
        SoundBox.getCtx();
        holdProgress = 0;
        gaugeFill.style.width = '0%';

        holdTimer = setInterval(() => {
          holdProgress += 5;
          gaugeFill.style.width = holdProgress + '%';
          if (holdProgress % 20 === 0) SoundBox.haptic(15);

          if (holdProgress >= 100) {
            clearInterval(holdTimer);
            sealClasp();
          }
        }, 90);
      }

      function cancelHold() {
        if (hasClasped) return;
        clearInterval(holdTimer);
        holdProgress = 0;
        gaugeFill.style.width = '0%';
      }

      function sealClasp() {
        hasClasped = true;
        coffin.classList.add('is-clasped');
        SoundBox.playBellToll();
        createBurst(window.innerWidth / 2, window.innerHeight * 0.45, 45);

        setTimeout(() => {
          proceedBtn.style.display = 'inline-block';
        }, 1200);
      }

      handRight.addEventListener('mousedown', startHold);
      window.addEventListener('mouseup', cancelHold);
      handRight.addEventListener('touchstart', startHold, { passive: false });
      window.addEventListener('touchend', cancelHold);

      // 6. Act 1 -> Act 2 Transition
      const actCoffin = document.getElementById('actCoffin');
      const actLetter = document.getElementById('actLetter');

      proceedBtn.addEventListener('click', () => {
        createBurst(window.innerWidth / 2, window.innerHeight * 0.5, 60);
        SoundBox.playCoffinSlide();
        actCoffin.classList.add('is-exited');

        setTimeout(() => {
          actLetter.classList.add('is-active');
          if (letterData.enableScratch) initTombScratch();
          startTypewriter(letterData.body);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }, 600);
      });

      // 7. Photo Album
      const photoCard = document.getElementById('photoFlipCasket');
      const frontImg = document.getElementById('frontPhotoImg');
      const backCaption = document.getElementById('backCaptionText');
      const navRack = document.getElementById('photoNavRack');
      const pageIndicator = document.getElementById('photoPageIndicator');
      const prevBtn = document.getElementById('prevPhotoBtn');
      const nextBtn = document.getElementById('nextPhotoBtn');

      let currentPhotoIdx = 0;
      const photoList = letterData.photos || [];

      if (photoList.length > 0) {
        function renderPhoto(idx) {
          photoCard.classList.remove('is-flipped');
          frontImg.src = photoList[idx].url;
          backCaption.innerText = photoList[idx].caption || "";
          pageIndicator.innerText = `${idx + 1} / ${photoList.length}`;
        }
        renderPhoto(0);

        photoCard.addEventListener('click', (e) => {
          e.stopPropagation();
          photoCard.classList.toggle('is-flipped');
          SoundBox.haptic(25);
        });

        if (photoList.length <= 1) {
          navRack.style.display = 'none';
        } else {
          prevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            currentPhotoIdx = (currentPhotoIdx - 1 + photoList.length) % photoList.length;
            renderPhoto(currentPhotoIdx);
          });
          nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            currentPhotoIdx = (currentPhotoIdx + 1) % photoList.length;
            renderPhoto(currentPhotoIdx);
          });
        }
      } else {
        document.getElementById('photoAlbumBox').style.display = 'none';
      }

      // 8. Typewriter
      let typewriterTimer = null;
      let isDoneTyping = false;
      const textEl = document.getElementById('typewriterText');
      const cursor = document.getElementById('typewriterCursor');

      function startTypewriter(str) {
        if (!str) return;
        let idx = 0;
        const speed = str.length > 400 ? 12 : 28;
        typewriterTimer = setInterval(() => {
          if (idx < str.length) {
            textEl.innerText += str.charAt(idx);
            idx++;
          } else {
            finishTyping(str);
          }
        }, speed);

        document.addEventListener('click', function skip() {
          if (!isDoneTyping) {
            finishTyping(str);
            document.removeEventListener('click', skip);
          }
        });
      }

      function finishTyping(str) {
        clearInterval(typewriterTimer);
        textEl.innerText = str;
        isDoneTyping = true;
        cursor.style.display = 'none';
      }

      // 9. Blood Pact Stamp Easter Egg
      const bloodBtn = document.getElementById('bloodStampBtn');
      const bloodResult = document.getElementById('bloodPactResult');
      bloodBtn.addEventListener('click', () => {
        SoundBox.playBellToll();
        bloodBtn.style.display = 'none';
        bloodResult.style.display = 'block';
        createBurst(window.innerWidth / 2, bloodResult.getBoundingClientRect().top, 30);
      });

      // 10. Gravestone Scratch
      function initTombScratch() {
        const scratchSec = document.getElementById('scratchSection');
        if (!letterData.enableScratch) {
          scratchSec.style.display = 'none';
          return;
        }

        document.getElementById('scratchHintText').innerText = letterData.scratchHint;
        document.getElementById('scratchSecretReveal').innerText = letterData.scratchSecret;

        const sCanvas = document.getElementById('scratchCanvas');
        const sCtx = sCanvas.getContext('2d');
        const frame = sCanvas.parentElement;
        const w = frame.clientWidth || 320;
        const h = frame.clientHeight || 82;
        sCanvas.width = w;
        sCanvas.height = h;

        // Gravestone stone texture
        const grad = sCtx.createLinearGradient(0, 0, w, h);
        grad.addColorStop(0, '#2b2336');
        grad.addColorStop(0.5, '#40344d');
        grad.addColorStop(1, '#1b1524');
        sCtx.fillStyle = grad;
        sCtx.fillRect(0, 0, w, h);

        sCtx.strokeStyle = '#ff3366';
        sCtx.lineWidth = 1.5;
        sCtx.strokeRect(10, 8, w - 20, h - 16);

        sCtx.fillStyle = '#ffccd5';
        sCtx.font = 'bold 10px Montserrat, sans-serif';
        sCtx.textAlign = 'center';
        sCtx.textBaseline = 'middle';
        sCtx.fillText('✦ SCRATCH TO EXPOSE CIPHER ✦', w / 2, h / 2);

        let isScratching = false;
        function scratch(e) {
          if (!isScratching) return;
          const rect = sCanvas.getBoundingClientRect();
          const cx = e.touches ? e.touches[0].clientX : e.clientX;
          const cy = e.touches ? e.touches[0].clientY : e.clientY;
          sCtx.globalCompositeOperation = 'destination-out';
          sCtx.beginPath();
          sCtx.arc(cx - rect.left, cy - rect.top, 18, 0, Math.PI * 2);
          sCtx.fill();
          SoundBox.haptic(10);
        }

        sCanvas.addEventListener('mousedown', () => isScratching = true);
        window.addEventListener('mouseup', () => isScratching = false);
        sCanvas.addEventListener('mousemove', scratch);
        sCanvas.addEventListener('touchstart', (e) => { isScratching = true; scratch(e); }, { passive: true });
        window.addEventListener('touchend', () => isScratching = false);
        sCanvas.addEventListener('touchmove', scratch, { passive: true });
      }

      // 11. Runaway Gate
      const runawaySec = document.getElementById('runawaySection');
      if (letterData.enableRunaway) {
        document.getElementById('runawayQuestion').innerText = letterData.runawayQuestion;
        const btnYes = document.getElementById('btnYes');
        const btnNo = document.getElementById('btnNo');
        const banner = document.getElementById('tombSuccessBanner');

        function evade(e) {
          e.preventDefault();
          const x = (Math.random() - 0.5) * 180;
          const y = (Math.random() - 0.5) * 80;
          btnNo.style.transform = `translate(${x}px, ${y}px)`;
          SoundBox.haptic(20);
        }

        btnNo.addEventListener('mouseover', evade);
        btnNo.addEventListener('touchstart', evade);

        btnYes.addEventListener('click', () => {
          SoundBox.playBellToll();
          btnNo.style.display = 'none';
          btnYes.style.display = 'none';
          document.getElementById('runawayQuestion').style.display = 'none';
          banner.innerText = letterData.runawaySuccessMessage;
          banner.style.display = 'block';
          createBurst(window.innerWidth / 2, banner.getBoundingClientRect().top, 40);
        });
      } else {
        runawaySec.style.display = 'none';
      }
    });
  </script>
</body>
</html>
