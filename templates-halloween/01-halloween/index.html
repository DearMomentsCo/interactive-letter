  <script src="data.js?v=gothic_casket_2.0.0"></script>
  <script>
    /* ==========================================================================
       GOTHIC ACOUSTIC & HAPTIC PHYSICAL SOUND ENGINE
       ========================================================================== */
    const SoundEngine = {
      ctx: null,
      getAudio() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        return this.ctx;
      },
      // Deep Wood Oak Slide
      playOakSlide() {
        try {
          const ctx = this.getAudio();
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(85, now);
          osc.frequency.exponentialRampToValueAtTime(32, now + 0.85);

          gain.gain.setValueAtTime(0.01, now);
          gain.gain.linearRampToValueAtTime(0.35, now + 0.15);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.85);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.85);
          this.haptic(50);
        } catch(e) {}
      },
      // Cathedral Bell & 55Hz Bone Strike
      playClaspBell() {
        try {
          const ctx = this.getAudio();
          const now = ctx.currentTime;
          const oscBell = ctx.createOscillator();
          const bellGain = ctx.createGain();
          oscBell.type = 'sine';
          oscBell.frequency.setValueAtTime(587.33, now);
          oscBell.frequency.exponentialRampToValueAtTime(293.66, now + 2.2);

          bellGain.gain.setValueAtTime(0.45, now);
          bellGain.gain.exponentialRampToValueAtTime(0.0001, now + 2.2);

          oscBell.connect(bellGain);
          bellGain.connect(ctx.destination);
          oscBell.start(now);
          oscBell.stop(now + 2.2);

          // 55Hz Sub-Bass Impulse for physical iOS speaker stroke
          const sub = ctx.createOscillator();
          const subGain = ctx.createGain();
          sub.type = 'sine';
          sub.frequency.setValueAtTime(55, now);
          subGain.gain.setValueAtTime(0.85, now);
          subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

          sub.connect(subGain);
          subGain.connect(ctx.destination);
          sub.start(now);
          sub.stop(now + 0.35);

          this.haptic([80, 40, 120]);
        } catch(e) {}
      },
      // Scratch Tick
      playScratchTick() {
        try {
          const ctx = this.getAudio();
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(800 + Math.random() * 400, now);
          osc.frequency.exponentialRampToValueAtTime(100, now + 0.03);

          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.03);
          this.haptic(10);
        } catch(e) {}
      },
      haptic(pattern) {
        if ('vibrate' in navigator) {
          try { navigator.vibrate(pattern); } catch(e) {}
        }
      }
    };

    /* Atmospheric Embers Particle Canvas */
    function initAtmosphere() {
      const canvas = document.getElementById('particleCanvas');
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      });

      const embers = Array.from({ length: 35 }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 2.2 + 0.6,
        vy: -(Math.random() * 0.45 + 0.15),
        vx: (Math.random() - 0.5) * 0.25,
        alpha: Math.random() * 0.5 + 0.2,
        color: Math.random() > 0.4 ? '#ff2a5f' : '#bcaed0'
      }));

      function render() {
        ctx.clearRect(0, 0, w, h);
        embers.forEach(p => {
          p.y += p.vy;
          p.x += p.vx;
          if (p.y < 0) {
            p.y = h + 10;
            p.x = Math.random() * w;
          }
          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
        requestAnimationFrame(render);
      }
      render();
    }

    /* Core Initialization */
    document.addEventListener('DOMContentLoaded', () => {
      initAtmosphere();

      // 1. Data Ingestion
      document.getElementById('statusDate').innerText = letterData.dateText || "OCTOBER 31, 2026";
      document.getElementById('parchmentDate').innerText = letterData.dateText || "OCTOBER 31, 2026";
      document.getElementById('parchmentHeadline').innerText = letterData.headline || "TILL DEATH DO US PART";
      document.getElementById('parchmentSubHeadline').innerText = letterData.subHeadline || "";
      document.getElementById('parchmentSalutation').innerText = letterData.salutation || "My Dearest,";
      document.getElementById('letterClosing').innerText = letterData.closing || "";
      document.getElementById('letterSignature').innerText = letterData.signature || "";

      if (letterData.fontType) {
        document.getElementById('letterBodyArea').style.fontFamily = `"${letterData.fontType}", Georgia, serif`;
      }

      // 2. Audio Player Logic
      const bgAudio = document.getElementById('bgAudio');
      const audioBtn = document.getElementById('audioController');
      let isMusicPlaying = false;

      if (letterData.audioUrl) {
        bgAudio.src = letterData.audioUrl;
        audioBtn.addEventListener('click', () => {
          if (isMusicPlaying) {
            bgAudio.pause();
            audioBtn.classList.remove('is-playing');
            isMusicPlaying = false;
          } else {
            bgAudio.play().then(() => {
              audioBtn.classList.add('is-playing');
              isMusicPlaying = true;
            }).catch(() => {});
          }
        });
      } else {
        audioBtn.style.display = 'none';
      }

      // 3. Passcode Gate System
      const overlay = document.getElementById('passcodeOverlay');
      if (!letterData.passcode) {
        overlay.classList.add('is-unlocked');
      } else {
        const inputs = document.querySelectorAll('.passcode-digit');
        const errorEl = document.getElementById('passcodeError');
        inputs.forEach((input, index) => {
          input.addEventListener('input', (e) => {
            if (e.target.value.length === 1 && index < inputs.length - 1) {
              inputs[index + 1].focus();
            }
            checkPasscode();
          });
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !e.target.value && index > 0) {
              inputs[index - 1].focus();
            }
          });
        });

        function checkPasscode() {
          const entered = Array.from(inputs).map(i => i.value).join('');
          if (entered.length === 4) {
            if (entered === letterData.passcode) {
              SoundEngine.playOakSlide();
              overlay.classList.add('is-unlocked');
            } else {
              errorEl.innerText = "THE CIPHER REJECTS YOUR TOUCH";
              SoundEngine.haptic([100, 50, 100]);
              inputs.forEach(i => i.value = '');
              inputs[0].focus();
            }
          }
        }
      }

      // 4. Coffin Unsealing (Click Wax Cross)
      const coffinStation = document.getElementById('coffinStation');
      const coffinLid = document.getElementById('coffinLid');

      coffinLid.addEventListener('click', () => {
        SoundEngine.playOakSlide();
        coffinStation.classList.add('is-opened');
        if (letterData.audioUrl && !isMusicPlaying) {
          bgAudio.play().then(() => {
            audioBtn.classList.add('is-playing');
            isMusicPlaying = true;
          }).catch(() => {});
        }
      });

      // 5. Skeleton Hand Clasp (1.8s Continuous Touch)
      const handRightBtn = document.getElementById('handRightBtn');
      const holdMeter = document.getElementById('holdMeterFill');
      const enterCryptBtn = document.getElementById('enterCryptBtn');
      let holdTimer = null;
      let progress = 0;
      let isVowSealed = false;

      function startHold(e) {
        if (isVowSealed || !coffinStation.classList.contains('is-opened')) return;
        e.preventDefault();
        progress = 0;
        holdMeter.style.width = '0%';

        holdTimer = setInterval(() => {
          progress += 5;
          holdMeter.style.width = progress + '%';
          if (progress % 20 === 0) SoundEngine.haptic(15);

          if (progress >= 100) {
            clearInterval(holdTimer);
            sealVow();
          }
        }, 90);
      }

      function cancelHold() {
        if (isVowSealed) return;
        clearInterval(holdTimer);
        progress = 0;
        holdMeter.style.width = '0%';
      }

      function sealVow() {
        isVowSealed = true;
        coffinStation.classList.add('is-clasped');
        SoundEngine.playClaspBell();

        // Reveal the Portal Button to Transition to Act 2
        setTimeout(() => {
          enterCryptBtn.style.display = 'block';
        }, 1200);
      }

      handRightBtn.addEventListener('mousedown', startHold);
      window.addEventListener('mouseup', cancelHold);
      handRightBtn.addEventListener('touchstart', startHold, { passive: false });
      window.addEventListener('touchend', cancelHold);

      // 6. Act 1 to Act 2 Smooth Screen Transition
      const actCoffin = document.getElementById('actCoffinStage');
      const actLetter = document.getElementById('actLetterStage');

      enterCryptBtn.addEventListener('click', () => {
        SoundEngine.playOakSlide();
        actCoffin.classList.add('is-dismissed');
        
        setTimeout(() => {
          actLetter.classList.add('is-revealed');
          if (letterData.enableScratch) initAshesScratch();
          startTypewriter(letterData.body);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }, 600);
      });

      // 7. Interactive Candle Surprise
      const candleAltar = document.getElementById('candleAltar');
      const candleFlame = document.getElementById('candleFlame');
      let isFlameLit = true;

      candleAltar.addEventListener('click', () => {
        isFlameLit = !isFlameLit;
        candleFlame.style.opacity = isFlameLit ? '1' : '0';
        SoundEngine.haptic(30);
      });

      // 8. 3D Polaroid Photo Album
      const photoCard = document.getElementById('photoFlipCard');
      const frontImg = document.getElementById('frontPhotoImg');
      const backCaption = document.getElementById('backCaptionText');
      const navRack = document.getElementById('photoNavRack');
      const pageIndicator = document.getElementById('photoPageIndicator');
      const prevBtn = document.getElementById('prevPhotoBtn');
      const nextBtn = document.getElementById('nextPhotoBtn');

      let currentPhotoIdx = 0;
      const photoList = letterData.photos || [];

      if (photoList.length > 0) {
        function renderPhoto(idx) {
          photoCard.classList.remove('is-flipped');
          frontImg.src = photoList[idx].url;
          backCaption.innerText = photoList[idx].caption || "";
          pageIndicator.innerText = `${idx + 1} / ${photoList.length}`;
        }
        renderPhoto(0);

        photoCard.addEventListener('click', (e) => {
          e.stopPropagation();
          photoCard.classList.toggle('is-flipped');
          SoundEngine.haptic(25);
        });

        if (photoList.length <= 1) {
          navRack.style.display = 'none';
        } else {
          prevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            currentPhotoIdx = (currentPhotoIdx - 1 + photoList.length) % photoList.length;
            renderPhoto(currentPhotoIdx);
          });
          nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            currentPhotoIdx = (currentPhotoIdx + 1) % photoList.length;
            renderPhoto(currentPhotoIdx);
          });
        }
      } else {
        document.getElementById('photoAlbumSection').style.display = 'none';
      }

      // 9. Typewriter Engine
      let typewriterTimer = null;
      let isFinishedTyping = false;
      const textContainer = document.getElementById('typewriterText');
      const cursor = document.getElementById('typewriterCursor');

      function startTypewriter(fullText) {
        if (!fullText) return;
        let index = 0;
        const total = fullText.length;
        let speed = total > 400 ? 12 : 28;

        typewriterTimer = setInterval(() => {
          if (index < total) {
            textContainer.innerText += fullText.charAt(index);
            index++;
          } else {
            finishTyping(fullText);
          }
        }, speed);

        document.addEventListener('click', function skipTyping() {
          if (!isFinishedTyping) {
            finishTyping(fullText);
            document.removeEventListener('click', skipTyping);
          }
        });
      }

      function finishTyping(fullText) {
        clearInterval(typewriterTimer);
        textContainer.innerText = fullText;
        isFinishedTyping = true;
        cursor.style.display = 'none';
      }

      // 10. Ashes Scratch-Off Canvas
      function initAshesScratch() {
        const scratchSec = document.getElementById('scratchSection');
        if (!letterData.enableScratch) {
          scratchSec.style.display = 'none';
          return;
        }

        document.getElementById('scratchHintText').innerText = letterData.scratchHint;
        document.getElementById('scratchSecretReveal').innerText = letterData.scratchSecret;

        const canvas = document.getElementById('scratchCanvas');
        const ctx = canvas.getContext('2d');
        const frame = canvas.parentElement;
        const w = frame.clientWidth || 320;
        const h = frame.clientHeight || 86;
        canvas.width = w;
        canvas.height = h;

        const grad = ctx.createLinearGradient(0, 0, w, h);
        grad.addColorStop(0, '#1c1524');
        grad.addColorStop(0.5, '#2e243b');
        grad.addColorStop(1, '#100c16');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
        for (let i = 0; i < w; i += 4) {
          for (let j = 0; j < h; j += 4) {
            if (Math.random() > 0.5) ctx.fillRect(i, j, 1, 1);
          }
        }

        ctx.strokeStyle = '#e6194b';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(10, 8, w - 20, h - 16);

        ctx.fillStyle = '#f0edf7';
        ctx.font = 'bold 10px Montserrat, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('✦ SCRATCH THE CRYPT ASHES ✦', w / 2, h / 2);

        let isScratching = false;
        function scratch(e) {
          if (!isScratching) return;
          const rect = canvas.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          ctx.globalCompositeOperation = 'destination-out';
          ctx.beginPath();
          ctx.arc(clientX - rect.left, clientY - rect.top, 20, 0, Math.PI * 2);
          ctx.fill();
          SoundEngine.playScratchTick();
        }

        canvas.addEventListener('mousedown', () => isScratching = true);
        window.addEventListener('mouseup', () => isScratching = false);
        canvas.addEventListener('mousemove', scratch);
        canvas.addEventListener('touchstart', (e) => { isScratching = true; scratch(e); }, { passive: true });
        window.addEventListener('touchend', () => isScratching = false);
        canvas.addEventListener('touchmove', scratch, { passive: true });
      }

      // 11. Runaway Vow Gate
      const runawaySec = document.getElementById('runawaySection');
      if (letterData.enableRunaway) {
        document.getElementById('runawayQuestion').innerText = letterData.runawayQuestion;
        const btnYes = document.getElementById('btnYes');
        const btnNo = document.getElementById('btnNo');
        const banner = document.getElementById('gateSuccessBanner');

        function evade(e) {
          e.preventDefault();
          const x = (Math.random() - 0.5) * 180;
          const y = (Math.random() - 0.5) * 90;
          btnNo.style.transform = `translate(${x}px, ${y}px)`;
          SoundEngine.haptic(25);
        }

        btnNo.addEventListener('mouseover', evade);
        btnNo.addEventListener('touchstart', evade);

        btnYes.addEventListener('click', (e) => {
          e.stopPropagation();
          SoundEngine.playClaspBell();
          btnNo.style.display = 'none';
          btnYes.style.display = 'none';
          document.getElementById('runawayQuestion').style.display = 'none';
          banner.innerText = letterData.runawaySuccessMessage;
          banner.style.display = 'block';
        });
      } else {
        runawaySec.style.display = 'none';
      }
    });
  </script>
</body>
</html>
