<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Till Death Do Us Part</title>
  <link rel="stylesheet" href="style.css?v=1.0.0">
</head>
<body>

  <!-- Background Ambience Canvas -->
  <canvas id="fogCanvas" class="fog-canvas"></canvas>

  <!-- Passcode Modal Gate -->
  <div id="lockOverlay" class="lock-overlay">
    <div class="lock-box">
      <div class="lock-title">ENTER CIPHER</div>
      <div class="pin-inputs">
        <input type="tel" maxlength="1" class="pin-digit" inputmode="numeric" autofocus>
        <input type="tel" maxlength="1" class="pin-digit" inputmode="numeric">
        <input type="tel" maxlength="1" class="pin-digit" inputmode="numeric">
        <input type="tel" maxlength="1" class="pin-digit" inputmode="numeric">
      </div>
      <div class="lock-hint">FOUR DIGITS TO UNSEAL</div>
    </div>
  </div>

  <!-- Primary Interactive Scene -->
  <main class="stage">
    
    <header class="header-area">
      <div id="dateText" class="date-pill"></div>
      <h1 id="headline" class="main-headline"></h1>
    </header>

    <!-- Victorian Coffin Object -->
    <div id="coffinContainer" class="coffin-container">
      
      <!-- Velvet Interior -->
      <div class="coffin-body">
        <div class="coffin-velvet">
          
          <div class="hands-stage">
            <!-- Left Hand Skeleton SVG -->
            <svg class="skeleton-hand hand-left" viewBox="0 0 100 140" fill="none" stroke="#f0edf7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M 50 135 L 50 95 M 42 135 L 42 98 M 58 135 L 58 98" stroke="#9d98a6"/>
              <!-- Wrist bones -->
              <ellipse cx="50" cy="90" rx="14" ry="6" fill="#1b1921"/>
              <!-- Fingers -->
              <path d="M 40 85 C 32 70, 25 55, 20 40 C 18 35, 22 28, 28 32 C 34 36, 38 60, 42 80"/>
              <path d="M 46 84 C 44 60, 42 35, 45 15 C 46 10, 52 10, 54 16 C 56 35, 52 65, 50 84"/>
              <path d="M 52 84 C 55 62, 58 38, 64 22 C 66 17, 72 18, 72 24 C 70 42, 62 66, 56 84"/>
              <path d="M 56 86 C 65 72, 75 58, 85 48 C 89 44, 94 48, 91 54 C 82 68, 70 82, 60 88"/>
              <!-- Thumb -->
              <path d="M 38 88 C 28 85, 15 88, 8 95 C 4 99, 8 104, 14 102 C 24 98, 34 94, 38 92"/>
            </svg>

            <!-- Blooming Gothic Rose -->
            <svg class="rose-bloom" viewBox="0 0 100 100" fill="none">
              <circle cx="50" cy="50" r="18" fill="#8b001c"/>
              <path d="M 50 32 C 38 32 30 42 30 52 C 30 64 42 72 50 78 C 58 72 70 64 70 52 C 70 42 62 32 50 32 Z" fill="#b30024" opacity="0.8"/>
              <path d="M 40 45 C 45 38 55 38 60 45 C 62 52 56 60 50 64 C 44 60 38 52 40 45 Z" fill="#e6194b"/>
              <path d="M 28 50 Q 20 54 18 64 Q 26 62 32 56" stroke="#2d5a27" stroke-width="2" fill="#1b3817"/>
              <path d="M 72 50 Q 80 54 82 64 Q 74 62 68 56" stroke="#2d5a27" stroke-width="2" fill="#1b3817"/>
            </svg>

            <!-- Right Hand Skeleton SVG -->
            <svg id="handRight" class="skeleton-hand hand-right hand-pulse" viewBox="0 0 100 140" fill="none" stroke="#f0edf7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M 50 135 L 50 95 M 42 135 L 42 98 M 58 135 L 58 98" stroke="#9d98a6"/>
              <ellipse cx="50" cy="90" rx="14" ry="6" fill="#1b1921"/>
              <path d="M 60 85 C 68 70, 75 55, 80 40 C 82 35, 78 28, 72 32 C 66 36, 62 60, 58 80"/>
              <path d="M 54 84 C 56 60, 58 35, 55 15 C 54 10, 48 10, 46 16 C 44 35, 48 65, 50 84"/>
              <path d="M 48 84 C 45 62, 42 38, 36 22 C 34 17, 28 18, 28 24 C 30 42, 38 66, 44 84"/>
              <path d="M 44 86 C 35 72, 25 58, 15 48 C 11 44, 6 48, 9 54 C 18 68, 30 82, 40 88"/>
              <path d="M 62 88 C 72 85, 85 88, 92 95 C 96 99, 92 104, 86 102 C 76 98, 66 94, 62 92"/>
            </svg>
          </div>

          <!-- Hold Progress for Mobile / Desktop -->
          <div class="hold-ring">
            <div class="ring-track">
              <div id="ringFill" class="ring-fill"></div>
            </div>
            <span class="hold-text">HOLD TO SEAL VOW</span>
          </div>

        </div>
      </div>

      <!-- Sliding Coffin Lid -->
      <div id="coffinLid" class="coffin-lid">
        <div class="lid-crest">
          <div class="cross-seal">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="#f0edf7">
              <path d="M10 2 H14 V7 H19 V11 H14 V22 H10 V11 H5 V7 H10 Z"/>
            </svg>
          </div>
          <div class="lid-instruction">TAP WAX TO UNSEAL</div>
        </div>
      </div>

    </div>

    <!-- Parchment Letter Emerges After Vow -->
    <article id="parchmentScroll" class="parchment-scroll">
      <div id="letterSalutation" class="scroll-salutation"></div>
      <div id="letterBody" class="scroll-body"></div>
      
      <!-- Photo Carousel -->
      <section id="photoGallery" class="scroll-gallery"></section>

      <!-- Scratch-off Secret Block -->
      <section id="scratchSection" class="scratch-block">
        <div class="scratch-header" id="scratchTitle"></div>
        <div class="scratch-canvas-wrap">
          <div id="scratchSecret" class="scratch-secret"></div>
          <canvas id="scratchCanvas"></canvas>
        </div>
      </section>

      <div id="letterClosing" class="scroll-closing"></div>
      <div id="letterSignature" class="scroll-signature"></div>

      <!-- Runaway Button Section -->
      <section id="vowSection" class="vow-section">
        <div id="vowQuestion" class="vow-question"></div>
        <div class="vow-buttons">
          <button id="btnYes" class="vow-btn vow-btn-yes">YES, FOREVER</button>
          <button id="btnNo" class="vow-btn vow-btn-no">NEVER</button>
        </div>
        <div id="vowSuccess" class="vow-success"></div>
      </section>
    </article>

  </main>

  <!-- External Script Reference -->
  <script src="data.js?v=1.0.0"></script>
  <script>
    /* Audio & Haptic Synthesizer (Zero External File Dependencies) */
    const SoundEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      // Heavy Oak Coffin Creak / Slide
      playCoffinOpen() {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(65, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(35, this.ctx.currentTime + 0.8);
        
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.8);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.8);
        this.haptic(40);
      },
      // Clasping Bone & Resonant Bell
      playClasp() {
        this.init();
        // High resonance bell
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(260, this.ctx.currentTime + 1.6);
        
        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 1.6);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 1.6);

        // Low frequency thud for iOS tactile illusion
        const subOsc = this.ctx.createOscillator();
        const subGain = this.ctx.createGain();
        subOsc.type = 'sine';
        subOsc.frequency.setValueAtTime(55, this.ctx.currentTime);
        subGain.gain.setValueAtTime(0.8, this.ctx.currentTime);
        subGain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
        subOsc.connect(subGain);
        subGain.connect(this.ctx.destination);
        subOsc.start();
        subOsc.stop(this.ctx.currentTime + 0.25);

        this.haptic([60, 40, 80]);
      },
      // Dual-mode Haptic
      haptic(pattern) {
        if ('vibrate' in navigator) {
          try { navigator.vibrate(pattern); } catch(e){}
        }
      }
    };

    /* Subtle Atmospheric Fog Particles */
    function initAtmosphere() {
      const canvas = document.getElementById('fogCanvas');
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      });

      const particles = Array.from({ length: 35 }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 2.5 + 0.5,
        dx: (Math.random() - 0.5) * 0.3,
        dy: -Math.random() * 0.4 - 0.1,
        alpha: Math.random() * 0.6 + 0.2
      }));

      function render() {
        ctx.clearRect(0, 0, w, h);
        particles.forEach(p => {
          p.x += p.dx;
          p.y += p.dy;
          if (p.y < 0) p.y = h;
          if (p.x < 0) p.x = w;
          if (p.x > w) p.x = 0;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(200, 190, 220, ${p.alpha})`;
          ctx.fill();
        });
        requestAnimationFrame(render);
      }
      render();
    }

    /* Core Initialization */
    document.addEventListener('DOMContentLoaded', () => {
      initAtmosphere();

      // 1. Data Ingestion
      document.getElementById('dateText').textContent = letterData.dateText;
      document.getElementById('headline').textContent = letterData.headline;
      document.getElementById('letterSalutation').textContent = letterData.salutation;
      document.getElementById('letterBody').textContent = letterData.body;
      document.getElementById('letterClosing').textContent = letterData.closing;
      document.getElementById('letterSignature').textContent = letterData.signature;

      if (letterData.fontType) {
        document.getElementById('parchmentScroll').style.fontFamily = `"${letterData.fontType}", serif`;
      }

      // Render Photo Gallery
      const gallery = document.getElementById('photoGallery');
      if (letterData.photos && letterData.photos.length > 0) {
        letterData.photos.forEach(p => {
          const card = document.createElement('div');
          card.className = 'polaroid-card';
          card.innerHTML = `
            <img class="polaroid-img" src="${p.url}" alt="Memory" loading="lazy">
            <div class="polaroid-caption">${p.caption}</div>
          `;
          gallery.appendChild(card);
        });
      } else {
        gallery.style.display = 'none';
      }

      // 2. Passcode Logic
      const lockOverlay = document.getElementById('lockOverlay');
      if (!letterData.passcode || letterData.passcode.trim() === '') {
        lockOverlay.classList.add('unlocked');
      } else {
        const inputs = document.querySelectorAll('.pin-digit');
        inputs.forEach((input, index) => {
          input.addEventListener('input', (e) => {
            if (e.target.value.length === 1 && index < inputs.length - 1) {
              inputs[index + 1].focus();
            }
            checkPin();
          });
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !e.target.value && index > 0) {
              inputs[index - 1].focus();
            }
          });
        });

        function checkPin() {
          const entered = Array.from(inputs).map(i => i.value).join('');
          if (entered.length === 4) {
            if (entered === letterData.passcode) {
              SoundEngine.playCoffinOpen();
              lockOverlay.classList.add('unlocked');
            } else {
              SoundEngine.haptic(200);
              inputs.forEach(i => i.value = '');
              inputs[0].focus();
            }
          }
        }
      }

      // 3. Coffin Lid Click
      const coffin = document.getElementById('coffinContainer');
      const coffinLid = document.getElementById('coffinLid');
      coffinLid.addEventListener('click', () => {
        SoundEngine.playCoffinOpen();
        coffin.classList.add('open');
      });

      // 4. Skeleton Hand Hold Interaction (1.8s)
      const handRight = document.getElementById('handRight');
      const ringFill = document.getElementById('ringFill');
      const parchment = document.getElementById('parchmentScroll');
      let holdTimer = null;
      let holdProgress = 0;
      let hasClasped = false;

      function startHold(e) {
        if (hasClasped || !coffin.classList.contains('open')) return;
        e.preventDefault();
        SoundEngine.init();
        holdProgress = 0;
        ringFill.style.width = '0%';
        
        holdTimer = setInterval(() => {
          holdProgress += 4;
          ringFill.style.width = holdProgress + '%';
          if (holdProgress % 20 === 0) SoundEngine.haptic(15);

          if (holdProgress >= 100) {
            clearInterval(holdTimer);
            sealVow();
          }
        }, 72); // ~1.8 seconds total
      }

      function cancelHold() {
        if (hasClasped) return;
        clearInterval(holdTimer);
        holdProgress = 0;
        ringFill.style.width = '0%';
      }

      function sealVow() {
        hasClasped = true;
        coffin.classList.add('clasped');
        SoundEngine.playClasp();
        
        setTimeout(() => {
          parchment.classList.add('revealed');
          initScratch();
          parchment.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 1200);
      }

      handRight.addEventListener('mousedown', startHold);
      window.addEventListener('mouseup', cancelHold);
      handRight.addEventListener('touchstart', startHold, { passive: false });
      window.addEventListener('touchend', cancelHold);

      // 5. Scratch Canvas
      function initScratch() {
        const scratchSec = document.getElementById('scratchSection');
        if (!letterData.enableScratch) {
          scratchSec.style.display = 'none';
          return;
        }
        document.getElementById('scratchTitle').textContent = letterData.scratchTitle;
        document.getElementById('scratchSecret').textContent = letterData.scratchSecret;

        const canvas = document.getElementById('scratchCanvas');
        const ctx = canvas.getContext('2d');
        const wrap = canvas.parentElement;
        canvas.width = wrap.offsetWidth;
        canvas.height = wrap.offsetHeight;

        ctx.fillStyle = '#26222b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Gothic Pattern overlay on scratch layer
        ctx.fillStyle = '#3a3342';
        for (let i = 0; i < canvas.width; i += 24) {
          ctx.fillRect(i, 0, 1, canvas.height);
        }

        let isScratching = false;

        function scratch(e) {
          if (!isScratching) return;
          const rect = canvas.getBoundingClientRect();
          const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
          const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;

          ctx.globalCompositeOperation = 'destination-out';
          ctx.beginPath();
          ctx.arc(x, y, 18, 0, Math.PI * 2);
          ctx.fill();
          SoundEngine.haptic(8);
        }

        canvas.addEventListener('mousedown', () => isScratching = true);
        window.addEventListener('mouseup', () => isScratching = false);
        canvas.addEventListener('mousemove', scratch);

        canvas.addEventListener('touchstart', (e) => { isScratching = true; scratch(e); }, { passive: false });
        window.addEventListener('touchend', () => isScratching = false);
        canvas.addEventListener('touchmove', scratch, { passive: false });
      }

      // 6. Runaway Button Interaction
      const vowSec = document.getElementById('vowSection');
      if (letterData.enableRunaway) {
        document.getElementById('vowQuestion').textContent = letterData.runawayQuestion;
        const btnYes = document.getElementById('btnYes');
        const btnNo = document.getElementById('btnNo');
        const vowSuccess = document.getElementById('vowSuccess');

        btnNo.addEventListener('mouseover', evade);
        btnNo.addEventListener('touchstart', evade);

        function evade(e) {
          e.preventDefault();
          const offsetX = (Math.random() - 0.5) * 160;
          const offsetY = (Math.random() - 0.5) * 80;
          btnNo.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
          SoundEngine.haptic(20);
        }

        btnYes.addEventListener('click', () => {
          SoundEngine.playClasp();
          btnNo.style.display = 'none';
          btnYes.style.display = 'none';
          document.getElementById('vowQuestion').style.display = 'none';
          vowSuccess.textContent = letterData.runawaySuccessMessage;
          vowSuccess.style.display = 'block';
        });
      } else {
        vowSec.style.display = 'none';
      }
    });
  </script>
</body>
</html>
