<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Till Death Do Us Part</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../core.css?v=1.0.1">
  <link rel="stylesheet" href="style.css?v=1.0.1">
</head>
<body>
  <canvas id="ambient-canvas"></canvas>

  <audio id="bg-audio" preload="auto" loop></audio>
  <button id="audio-toggle" class="audio-btn" aria-label="Toggle Audio">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M9 18V5l12-2v13"></path>
      <circle cx="6" cy="18" r="3"></circle>
      <circle cx="18" cy="16" r="3"></circle>
    </svg>
  </button>

  <!-- Passcode Layer -->
  <div id="passcode-overlay" class="overlay-passcode">
    <svg class="passcode-crest" viewBox="0 0 100 100" fill="none" stroke="#c4b5c7" stroke-width="2">
      <path d="M50 15 L50 85 M25 35 L75 35"/>
      <circle cx="50" cy="35" r="8"/>
      <path d="M35 60 Q50 48 65 60"/>
    </svg>
    <div class="passcode-title">Sanctum Locked</div>
    <div class="passcode-subtitle">Enter the 4-digit code to awake eternity</div>
    <div id="pin-box" class="pin-inputs">
      <input type="tel" inputmode="numeric" maxlength="1" class="pin-digit" autofocus>
      <input type="tel" inputmode="numeric" maxlength="1" class="pin-digit">
      <input type="tel" inputmode="numeric" maxlength="1" class="pin-digit">
      <input type="tel" inputmode="numeric" maxlength="1" class="pin-digit">
    </div>
  </div>

  <!-- Viewport Main Container -->
  <div class="viewport-container">
    
    <!-- Coffin Ceremony -->
    <div class="coffin-stage">
      <div class="coffin-box" id="coffin-box">
        
        <!-- Interior velvet & hands -->
        <div class="coffin-interior">
          <div class="hands-chamber">
            <svg class="skeletal-hands-svg" id="skeletal-hands" viewBox="0 0 300 320">
              <!-- Left Skeletal Hand -->
              <g id="hand-left" fill="none" stroke="#ddd2e0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M40 260 L85 200 L110 160"/>
                <path d="M110 160 L140 145 L155 140"/>
                <path d="M110 160 L145 160 L165 160"/>
                <path d="M105 170 L140 180 L160 180"/>
                <path d="M95 180 L125 200 L140 205"/>
                <circle cx="110" cy="160" r="3" fill="#ddd2e0"/>
                <circle cx="140" cy="145" r="2.5" fill="#ddd2e0"/>
                <circle cx="145" cy="160" r="2.5" fill="#ddd2e0"/>
              </g>

              <!-- Right Skeletal Hand -->
              <g id="hand-right" fill="none" stroke="#f1e6f5" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M260 260 L215 200 L190 160"/>
                <path d="M190 160 L160 145 L145 140"/>
                <path d="M190 160 L155 160 L135 160"/>
                <path d="M195 170 L160 180 L140 180"/>
                <path d="M205 180 L175 200 L160 205"/>
                <circle cx="190" cy="160" r="3" fill="#f1e6f5"/>
                <circle cx="160" cy="145" r="2.5" fill="#f1e6f5"/>
                <circle cx="155" cy="160" r="2.5" fill="#f1e6f5"/>
              </g>

              <!-- Thorny Rose Vines (Reveals on clasp) -->
              <g id="rose-vines" opacity="0" stroke="#8b0e2f" stroke-width="3" fill="none">
                <path d="M150 135 Q135 150 150 165 Q165 180 150 195"/>
                <circle cx="150" cy="135" r="5" fill="#e6194b"/>
                <circle cx="150" cy="165" r="4" fill="#8b0e2f"/>
                <circle cx="150" cy="195" r="6" fill="#e6194b"/>
              </g>
            </svg>

            <div class="hands-hold-hint" id="hands-hint">PRESS & HOLD RIGHT HAND<br>TO CLASP FOREVER</div>
            <div class="hold-progress-bar">
              <div class="hold-progress-fill" id="hold-progress"></div>
            </div>
          </div>
        </div>

        <!-- Coffin Lid (Cover) -->
        <div class="coffin-lid" id="coffin-lid">
          <div class="bone-seal" id="seal-trigger">
            <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
              <path d="M12 2v20M7 8h10"/>
              <circle cx="12" cy="8" r="2" fill="#fff"/>
            </svg>
          </div>
          <div class="lid-hint">Unseal Casket</div>
        </div>

      </div>
    </div>

    <!-- Parchment Letter Section -->
    <div class="scroll-section" id="scroll-section">
      <div class="parchment-sheet">
        <header class="letter-header">
          <div class="letter-date" id="render-date"></div>
          <div class="letter-headline" id="render-headline"></div>
        </header>
        <div class="letter-salutation" id="render-salutation"></div>
        <div class="letter-body" id="render-body" title="Click to reveal full text immediately"></div>
        <div class="letter-closing">
          <div id="render-closing"></div>
          <div id="render-signature" style="font-weight: 700; margin-top: 4px;"></div>
        </div>
      </div>

      <!-- 3D Photo Album -->
      <div class="album-section" id="album-section">
        <div class="photo-card-wrap" id="photo-card">
          <div class="photo-card-inner" id="photo-inner">
            <div class="photo-face photo-front">
              <img id="photo-img" src="" alt="Moment">
            </div>
            <div class="photo-face photo-back">
              <p id="photo-caption"></p>
            </div>
          </div>
        </div>
        <div class="album-controls">
          <button class="album-nav-btn" id="prev-photo">← Previous</button>
          <span style="font-size: 0.75rem; letter-spacing: 0.15em; color: #8f8294;">TAP PHOTO TO FLIP</span>
          <button class="album-nav-btn" id="next-photo">Next →</button>
        </div>
      </div>

      <!-- Scratch Secret -->
      <div class="scratch-container" id="scratch-section">
        <div class="scratch-secret" id="scratch-text"></div>
        <canvas id="scratch-canvas"></canvas>
      </div>

      <!-- Runaway Question -->
      <div class="runaway-box" id="runaway-section">
        <div class="runaway-q" id="runaway-question"></div>
        <div class="runaway-btns">
          <button class="btn-choice btn-yes" id="btn-yes">YES</button>
          <button class="btn-choice btn-no" id="btn-no">NO</button>
        </div>
        <div class="success-banner" id="success-banner"></div>
      </div>

    </div>

  </div>

  <script src="data.js?v=1.0.1"></script>
  <script>
    (function () {
      const data = window.LETTER_DATA;
      if (!data) return;

      // 1. Dual Haptic Touch Engine (Android Vibrate + iOS 55Hz Diaphragm Pulse)
      const hapticAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      function triggerHaptic(duration = 45) {
        if (navigator.vibrate) {
          navigator.vibrate(duration);
        } else if (hapticAudioCtx) {
          try {
            if (hapticAudioCtx.state === 'suspended') hapticAudioCtx.resume();
            const osc = hapticAudioCtx.createOscillator();
            const gain = hapticAudioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(55, hapticAudioCtx.currentTime); // 55Hz low displacement
            gain.gain.setValueAtTime(0.3, hapticAudioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, hapticAudioCtx.currentTime + (duration / 1000));
            osc.connect(gain);
            gain.connect(hapticAudioCtx.destination);
            osc.start();
            osc.stop(hapticAudioCtx.currentTime + (duration / 1000));
          } catch(e) {}
        }
      }

      // 2. Audio Engine
      const audio = document.getElementById('bg-audio');
      const audioBtn = document.getElementById('audio-toggle');
      if (data.audioUrl) {
        audio.src = data.audioUrl;
        audioBtn.addEventListener('click', () => {
          if (audio.paused) {
            audio.play().catch(() => {});
            audioBtn.classList.add('rotating');
          } else {
            audio.pause();
            audioBtn.classList.remove('rotating');
          }
        });
      } else {
        audioBtn.style.display = 'none';
      }

      // 3. Passcode Engine
      const passOverlay = document.getElementById('passcode-overlay');
      const pinInputs = document.querySelectorAll('.pin-digit');
      if (!data.passcode || data.passcode.trim() === "") {
        passOverlay.classList.add('hidden');
      } else {
        pinInputs.forEach((input, idx) => {
          input.addEventListener('input', (e) => {
            if (e.target.value.length === 1 && idx < pinInputs.length - 1) {
              pinInputs[idx + 1].focus();
            }
            checkPin();
          });
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !input.value && idx > 0) {
              pinInputs[idx - 1].focus();
            }
          });
        });
      }

      function checkPin() {
        const entered = Array.from(pinInputs).map(i => i.value).join('');
        if (entered.length === 4) {
          if (entered === data.passcode) {
            triggerHaptic(60);
            passOverlay.classList.add('hidden');
            if (data.audioUrl && audio.paused) {
              audio.play().then(() => audioBtn.classList.add('rotating')).catch(() => {});
            }
          } else {
            triggerHaptic(120);
            document.getElementById('pin-box').classList.add('shake-error');
            setTimeout(() => {
              document.getElementById('pin-box').classList.remove('shake-error');
              pinInputs.forEach(i => i.value = '');
              pinInputs[0].focus();
            }, 500);
          }
        }
      }

      // 4. Coffin Lid Opening
      const coffinLid = document.getElementById('coffin-lid');
      const sealTrigger = document.getElementById('seal-trigger');
      sealTrigger.addEventListener('click', () => {
        triggerHaptic(50);
        coffinLid.classList.add('opened');
      });

      // 5. Hands Clasp & Rose Bloom Interaction (1.8s hold)
      const handsSvg = document.getElementById('skeletal-hands');
      const holdProgress = document.getElementById('hold-progress');
      const handsHint = document.getElementById('hands-hint');
      const roseVines = document.getElementById('rose-vines');
      const scrollSection = document.getElementById('scroll-section');

      let holdTimer = null;
      let holdProgressVal = 0;
      let clasped = false;

      function startHold(e) {
        if (clasped || !coffinLid.classList.contains('opened')) return;
        e.preventDefault();
        holdProgressVal = 0;
        holdTimer = setInterval(() => {
          holdProgressVal += 5.5; // ~1.8 seconds to reach 100%
          holdProgress.style.width = Math.min(holdProgressVal, 100) + '%';
          if (holdProgressVal >= 100) {
            clearInterval(holdTimer);
            finishClasp();
          }
        }, 100);
      }

      function cancelHold() {
        if (clasped) return;
        clearInterval(holdTimer);
        holdProgressVal = 0;
        holdProgress.style.width = '0%';
      }

      function finishClasp() {
        clasped = true;
        triggerHaptic(100);
        document.getElementById('hand-left').style.transform = 'translateX(25px)';
        document.getElementById('hand-right').style.transform = 'translateX(-25px)';
        roseVines.style.transition = 'opacity 1.2s ease';
        roseVines.style.opacity = '1';
        handsHint.innerHTML = "✦ VOW SEALED IN BONE ✦";
        handsHint.style.color = "var(--rose-glow)";
        
        setTimeout(() => {
          scrollSection.classList.add('active');
          startTypewriter();
          scrollSection.scrollIntoView({ behavior: 'smooth' });
        }, 1200);
      }

      handsSvg.addEventListener('mousedown', startHold);
      handsSvg.addEventListener('touchstart', startHold, { passive: false });
      window.addEventListener('mouseup', cancelHold);
      window.addEventListener('touchend', cancelHold);

      // 6. Parchment Render & Typewriter
      document.getElementById('render-date').textContent = data.dateText;
      document.getElementById('render-headline').textContent = data.headline;
      document.getElementById('render-salutation').textContent = data.salutation;
      document.getElementById('render-closing').textContent = data.closing;
      document.getElementById('render-signature').textContent = data.signature || "";

      const bodyEl = document.getElementById('render-body');
      let typeIndex = 0;
      let typeTimeout = null;
      let typingCompleted = false;

      function startTypewriter() {
        if (typingCompleted) return;
        const text = data.body || "";
        const speed = Math.max(15, Math.min(45, 12000 / (text.length || 1)));

        function tick() {
          if (typeIndex < text.length) {
            bodyEl.textContent += text.charAt(typeIndex);
            typeIndex++;
            typeTimeout = setTimeout(tick, speed);
          } else {
            typingCompleted = true;
          }
        }
        tick();
      }

      bodyEl.addEventListener('click', () => {
        clearTimeout(typeTimeout);
        bodyEl.textContent = data.body || "";
        typingCompleted = true;
      });

      // 7. 3D Flip Photo Album
      let photoIdx = 0;
      const photoCard = document.getElementById('photo-card');
      const photoInner = document.getElementById('photo-inner');
      const photoImg = document.getElementById('photo-img');
      const photoCaption = document.getElementById('photo-caption');

      function updatePhoto() {
        if (!data.photos || data.photos.length === 0) {
          document.getElementById('album-section').style.display = 'none';
          return;
        }
        photoInner.classList.remove('flipped');
        photoImg.src = data.photos[photoIdx].url;
        photoCaption.textContent = data.photos[photoIdx].caption;
      }
      updatePhoto();

      photoCard.addEventListener('click', () => {
        photoInner.classList.toggle('flipped');
        triggerHaptic(30);
      });

      document.getElementById('prev-photo').addEventListener('click', (e) => {
        e.stopPropagation();
        if (data.photos && data.photos.length > 0) {
          photoIdx = (photoIdx - 1 + data.photos.length) % data.photos.length;
          updatePhoto();
        }
      });

      document.getElementById('next-photo').addEventListener('click', (e) => {
        e.stopPropagation();
        if (data.photos && data.photos.length > 0) {
          photoIdx = (photoIdx + 1) % data.photos.length;
          updatePhoto();
        }
      });

      // 8. Scratch-off Layer
      if (data.enableScratch) {
        document.getElementById('scratch-text').textContent = data.scratchSecret;
        const sCanvas = document.getElementById('scratch-canvas');
        const sCtx = sCanvas.getContext('2d');
        let isDrawing = false;
        let cleared = false;

        function initScratchCanvas() {
          sCanvas.width = sCanvas.offsetWidth;
          sCanvas.height = sCanvas.offsetHeight;
          sCtx.fillStyle = '#2b212f';
          sCtx.fillRect(0, 0, sCanvas.width, sCanvas.height);
          sCtx.fillStyle = '#c4b5c7';
          sCtx.font = '12px Cinzel, serif';
          sCtx.textAlign = 'center';
          sCtx.fillText('✦ SCRATCH TO REVEAL SECRET ✦', sCanvas.width / 2, sCanvas.height / 2 + 4);
        }
        setTimeout(initScratchCanvas, 300);

        function scratch(e) {
          if (!isDrawing || cleared) return;
          const rect = sCanvas.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          const x = clientX - rect.left;
          const y = clientY - rect.top;

          sCtx.globalCompositeOperation = 'destination-out';
          sCtx.beginPath();
          sCtx.arc(x, y, 22, 0, Math.PI * 2);
          sCtx.fill();
          triggerHaptic(15);
          checkScratchPercent();
        }

        function checkScratchPercent() {
          const imgData = sCtx.getImageData(0, 0, sCanvas.width, sCanvas.height);
          let transparent = 0;
          for (let i = 3; i < imgData.data.length; i += 16) {
            if (imgData.data[i] === 0) transparent++;
          }
          if (transparent > (imgData.data.length / 16) * 0.45) {
            cleared = true;
            sCanvas.style.transition = 'opacity 0.6s ease';
            sCanvas.style.opacity = '0';
            setTimeout(() => sCanvas.remove(), 600);
          }
        }

        sCanvas.addEventListener('mousedown', () => isDrawing = true);
        sCanvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); });
        window.addEventListener('mouseup', () => isDrawing = false);
        window.addEventListener('touchend', () => isDrawing = false);
        sCanvas.addEventListener('mousemove', scratch);
        sCanvas.addEventListener('touchmove', scratch);
      } else {
        document.getElementById('scratch-section').style.display = 'none';
      }

      // 9. Runaway Valentine Interaction
      if (data.enableRunaway) {
        document.getElementById('runaway-question').textContent = data.runawayQuestion;
        const noBtn = document.getElementById('btn-no');
        const yesBtn = document.getElementById('btn-yes');
        const successBanner = document.getElementById('success-banner');

        function teleportNo() {
          triggerHaptic(30);
          const maxDisplacement = 90;
          const randX = (Math.random() - 0.5) * maxDisplacement * 2;
          const randY = (Math.random() - 0.5) * maxDisplacement;
          noBtn.style.transform = `translate(${randX}px, ${randY}px)`;
        }

        noBtn.addEventListener('mouseenter', teleportNo);
        noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); teleportNo(); });

        yesBtn.addEventListener('click', () => {
          triggerHaptic(80);
          successBanner.textContent = data.runawaySuccessMessage;
          successBanner.style.display = 'block';
          noBtn.style.display = 'none';
          yesBtn.style.transform = 'scale(1.08)';
        });
      } else {
        document.getElementById('runaway-section').style.display = 'none';
      }

      // 10. Ambient Dust Canvas
      const ambCanvas = document.getElementById('ambient-canvas');
      const ambCtx = ambCanvas.getContext('2d');
      let particles = [];

      function resizeAmb() {
        ambCanvas.width = window.innerWidth;
        ambCanvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeAmb);
      resizeAmb();

      for (let i = 0; i < 40; i++) {
        particles.push({
          x: Math.random() * ambCanvas.width,
          y: Math.random() * ambCanvas.height,
          radius: Math.random() * 1.5 + 0.5,
          speedY: -(Math.random() * 0.4 + 0.1),
          alpha: Math.random() * 0.5 + 0.2
        });
      }

      function animateAmb() {
        ambCtx.clearRect(0, 0, ambCanvas.width, ambCanvas.height);
        particles.forEach(p => {
          p.y += p.speedY;
          if (p.y < 0) p.y = ambCanvas.height;
          ambCtx.beginPath();
          ambCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ambCtx.fillStyle = `rgba(215, 195, 225, ${p.alpha})`;
          ambCtx.fill();
        });
        requestAnimationFrame(animateAmb);
      }
      animateAmb();

    })();
  </script>
</body>
</html>
