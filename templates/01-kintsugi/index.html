<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Letter For You - Kintsugi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 背景星光微粒 -->
  <div class="stars-bg" id="starsBg"></div>

  <!-- 顶部音效切换按钮 -->
  <button class="audio-toggle" id="audioToggle" aria-label="Toggle Sound">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
      <path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zm-2.5 0L6.5 7.5H3v9h3.5l5 4.27V3.23zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
    </svg>
  </button>

  <!-- 全局 SVG 指纹模板定义 -->
  <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- 真实纸张墨水浸润毛边滤镜 -->
      <filter id="ink-bleed" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" />
      </filter>

      <!-- 真实人类完整指纹矢量组件 (不裁切、完整外轮廓、真实斗纹与分叉) -->
      <g id="human-thumbprint" filter="url(#ink-bleed)">
        <!-- 核心旋涡区 -->
        <path d="M100 135 c-2 -4 -6 -4 -6 2 c0 6 7 8 8 0" />
        <path d="M96 142 c-6 -3 -8 -12 2 -16 c10 -4 14 6 8 16" />
        <path d="M92 148 c-10 -5 -12 -22 4 -26 c16 -4 20 12 10 24" />
        <path d="M88 154 c-14 -7 -16 -30 6 -34 c22 -4 26 18 12 32" />
        <!-- 中层隆线与自然断点 -->
        <path d="M84 160 c-18 -10 -19 -38 8 -42 c28 -4 32 24 14 40" />
        <path d="M80 166 c-22 -12 -22 -46 10 -50 c34 -4 38 30 16 48" />
        <path d="M76 172 c-25 -14 -24 -54 12 -58 c38 -4 44 36 18 56" />
        <path d="M72 178 c-28 -16 -26 -62 14 -66 c42 -4 48 42 20 64" />
        <!-- 外层拱形与乳突纹流向 -->
        <path d="M68 184 c-30 -18 -28 -70 16 -74 c46 -4 52 48 22 72" />
        <path d="M64 190 c-32 -20 -30 -78 18 -82 c50 -4 56 54 24 80" />
        <path d="M60 196 c-34 -22 -32 -86 20 -90 c54 -4 60 60 26 88" />
        <path d="M56 202 c-36 -24 -34 -94 22 -98 c58 -4 64 66 28 96" />
        <!-- 指尖上拱区 -->
        <path d="M52 140 c-10 -40 20 -90 70 -90 c45 0 70 42 62 86" />
        <path d="M58 125 c-8 -35 18 -80 62 -80 c40 0 62 38 54 75" />
        <path d="M66 110 c-6 -30 16 -70 54 -70 c35 0 54 32 46 65" />
        <path d="M74 95 c-4 -25 14 -60 46 -60 c30 0 46 28 38 55" />
        <path d="M82 82 c-2 -20 12 -50 38 -50 c25 0 38 22 30 45" />
        <path d="M90 70 c0 -15 10 -40 30 -40 c20 0 28 18 22 35" />
        <!-- 指根三角区与细密边缘点线 -->
        <path d="M48 180 c-12 25 10 45 35 48" stroke-dasharray="14 3 8 2" />
        <path d="M152 180 c12 25 -10 45 -35 48" stroke-dasharray="12 4 6 2" />
        <path d="M60 215 c20 12 60 12 80 0" stroke-dasharray="18 4 12 3" />
        <path d="M68 225 c15 8 45 8 64 0" stroke-dasharray="15 3 9 2" />
        <path d="M76 235 c10 5 35 5 48 0" />
      </g>
    </defs>
  </svg>

  <!-- 主卡片 -->
  <main class="letter-card">
    <header class="header-section">
      <h1 class="main-title">WILL YOU FORGIVE ME AND LET US MEND?</h1>
      <div class="choice-buttons">
        <button class="btn btn-yes" id="btnYes">YES ♡</button>
        <button class="btn btn-no" id="btnNo">NO</button>
      </div>
    </header>

    <div class="ornament-divider">
      <span class="line"></span>
      <span class="diamond">◆</span>
      <span class="line"></span>
    </div>

    <section class="pledge-section">
      <h2 class="sub-title">✦ THE DOUBLE THUMBPRINT HEART ✦</h2>
      <p class="instruction-text" id="statusInstruction">
        "Her mark is waiting. Touch & hold below to ignite our bond into one heart"
      </p>

      <!-- 双指纹交互仪式框 -->
      <div class="thumbprint-touchpad" id="touchArea">
        <!-- 环形充电/长按进度条 -->
        <svg class="progress-ring" viewBox="0 0 260 240">
          <rect class="progress-border" x="4" y="4" width="252" height="232" rx="16" />
        </svg>

        <!-- 倾斜重叠构成的爱心指纹容器 -->
        <div class="heart-prints-container" id="heartPrints">
          <!-- 左侧：送信人指纹（初始深黑，向左倾斜 -24°） -->
          <div class="print-wrapper print-sender">
            <svg class="fingerprint-svg" viewBox="0 0 200 260">
              <use href="#human-thumbprint" />
            </svg>
          </div>

          <!-- 右侧：读信人指纹（初始微光呼吸引导，向右倾斜 +24°） -->
          <div class="print-wrapper print-receiver" id="receiverPrint">
            <svg class="fingerprint-svg" viewBox="0 0 200 260">
              <use href="#human-thumbprint" />
            </svg>
          </div>
        </div>

        <!-- 按印完成后的誓言印章 -->
        <div class="pledge-seal" id="pledgeSeal">
          <div class="seal-inner">
            <span>OFFICIAL</span>
            <span>PLEDGE</span>
            <span>MENDED</span>
          </div>
        </div>
      </div>

      <!-- 底部状态提示词 -->
      <p class="bottom-prompt" id="bottomPrompt">✦ HOLD THUMB ON HEART TO IGNITE (1.8S) ✦</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
