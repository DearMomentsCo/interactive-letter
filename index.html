<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>A Letter For You</title>

  <!-- Google 字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <!-- 1. 引入公共骨架 -->
  <link rel="stylesheet" href="core.css" />

  <!-- 2. 【仅引入金缮款专属样式】绝不污染其他模板 -->
  <link rel="stylesheet" href="theme-kintsugi.css" />
</head>
<body>

  <!-- 背景金箔粒子画布 -->
  <canvas id="particle-canvas"></canvas>

  <!-- 背景音频标签 -->
  <audio id="bgAudio" loop preload="auto"></audio>
  <button class="audio-toggle-btn" id="audioToggleBtn" title="Toggle Music" style="display:none;">🔊</button>

  <!-- 1. 密码锁遮罩系统 -->
  <div class="passcode-overlay" id="passcodeOverlay">
    <div class="passcode-box">
      <div class="passcode-title">ENTER 4-DIGIT PASSCODE</div>
      <div class="passcode-inputs">
        <input type="password" maxlength="1" class="passcode-digit" autofocus />
        <input type="password" maxlength="1" class="passcode-digit" />
        <input type="password" maxlength="1" class="passcode-digit" />
        <input type="password" maxlength="1" class="passcode-digit" />
      </div>
      <div class="passcode-error" id="passcodeError"></div>
    </div>
  </div>

  <!-- 2. 主视口 -->
  <div class="letter-viewport" data-theme="kintsugi">
    <div class="letter-container" id="letterContainer">
      
      <!-- 信封体系 -->
      <div class="envelope-wrapper" id="envelopeWrapper">
        <div class="envelope-custom-note" id="envelopeCustomNote"></div>
        <div class="envelope-body">
          <!-- 金缮专用流光金裂纹 -->
          <svg class="kintsugi-cracks" viewBox="0 0 520 350" preserveAspectRatio="none">
            <path d="M 0,60 Q 140,80 200,150 T 360,190 T 520,260" fill="none" stroke="#d4af37" stroke-width="2.4" />
            <path d="M 200,150 Q 240,210 270,350" fill="none" stroke="#c5a059" stroke-width="1.6" />
            <path d="M 360,190 Q 420,110 520,90" fill="none" stroke="#ecd08c" stroke-width="1.2" />
          </svg>
        </div>
        <div class="envelope-flap"></div>
        <div class="wax-seal-wrapper">
          <div class="wax-seal" id="waxSealBtn">♥</div>
        </div>
      </div>

      <!-- 信纸主体 -->
      <article class="letter-sheet" id="letterSheet">
        <div class="letter-date" id="letterDate"></div>
        <div class="letter-salutation" id="letterSalutation"></div>
        <h1 class="letter-title" id="letterHeadline"></h1>
        <div class="letter-body-text" id="letterBody"></div>
        <div class="letter-closing" id="letterClosing"></div>

        <!-- 3D 翻转相册 -->
        <div class="photos-section" id="photosSection">
          <div class="photo-flip-card" id="photoCard">
            <div class="photo-flip-inner">
              <div class="photo-card-front">
                <img id="frontPhotoImg" src="" alt="Photo" />
              </div>
              <div class="photo-card-back">
                <p class="photo-caption-text" id="backCaptionText"></p>
              </div>
            </div>
          </div>
          <div class="photo-flip-hint">✦ TAP PHOTO TO FLIP OVER ✦</div>
        </div>

        <!-- 创口贴造型刮刮乐 -->
        <div class="scratch-component" id="scratchComponent">
          <div class="scratch-hint-text" id="scratchHintText"></div>
          <div class="scratch-card-box">
            <div class="scratch-secret-reveal" id="scratchSecretReveal"></div>
            <canvas class="scratch-canvas" id="scratchCanvas"></canvas>
          </div>
        </div>

        <!-- 逃跑互动按钮问答 -->
        <div class="runaway-section" id="runawaySection">
          <div class="runaway-question" id="runawayQuestion"></div>
          <div class="runaway-buttons-wrapper">
            <button class="btn-yes" id="btnYes">Yes ♡</button>
            <button class="btn-no" id="btnNo">No</button>
          </div>
          <div class="runaway-success-modal" id="runawaySuccessModal"></div>
        </div>

      </article>

    </div>
  </div>

  <!-- 引入买家填空数据 -->
  <script src="data.js"></script>

  <script>
    // 1. 数据驱动内容渲染
    document.getElementById('envelopeCustomNote').innerText = LETTER_DATA.envelopeNote || '';
    document.getElementById('waxSealBtn').innerText = LETTER_DATA.waxSealMonogram || '♥';
    document.getElementById('letterDate').innerText = LETTER_DATA.dateText || '';
    document.getElementById('letterSalutation').innerText = LETTER_DATA.salutation || '';
    document.getElementById('letterHeadline').innerText = LETTER_DATA.headline || '';
    document.getElementById('letterBody').innerText = LETTER_DATA.body || '';
    document.getElementById('letterClosing').innerText = LETTER_DATA.closing || '';

    // 照片渲染
    if (LETTER_DATA.photos && LETTER_DATA.photos.length > 0) {
      document.getElementById('frontPhotoImg').src = LETTER_DATA.photos[0].url;
      document.getElementById('backCaptionText').innerText = LETTER_DATA.photos[0].caption;
      document.getElementById('photoCard').addEventListener('click', function() {
        this.classList.toggle('is-flipped');
      });
    } else {
      document.getElementById('photosSection').style.display = 'none';
    }

    // 刮刮乐开关
    if (!LETTER_DATA.enableScratch) {
      document.getElementById('scratchComponent').style.display = 'none';
    } else {
      document.getElementById('scratchHintText').innerText = LETTER_DATA.scratchHint;
      document.getElementById('scratchSecretReveal').innerText = LETTER_DATA.scratchSecret;
    }

    // 逃跑按钮开关
    if (!LETTER_DATA.enableRunaway) {
      document.getElementById('runawaySection').style.display = 'none';
    } else {
      document.getElementById('runawayQuestion').innerText = LETTER_DATA.runawayQuestion;
      document.getElementById('runawaySuccessModal').innerText = LETTER_DATA.runawaySuccessMessage;
    }

    // 2. 密码锁逻辑 (默认密码在 data.js 设为 1024)
    const overlay = document.getElementById('passcodeOverlay');
    if (!LETTER_DATA.passcode) {
      overlay.classList.add('is-unlocked');
    } else {
      const inputs = document.querySelectorAll('.passcode-digit');
      const errorEl = document.getElementById('passcodeError');

      inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
          if (e.target.value.length === 1 && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }
          checkPasscode();
        });
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !e.target.value && index > 0) {
            inputs[index - 1].focus();
          }
        });
      });

      function checkPasscode() {
        let entered = Array.from(inputs).map(i => i.value).join('');
        if (entered.length === 4) {
          if (entered === LETTER_DATA.passcode) {
            overlay.classList.add('is-unlocked');
          } else {
            errorEl.innerText = "Incorrect passcode. Try again.";
            inputs.forEach(i => i.value = '');
            inputs[0].focus();
          }
        } else {
          errorEl.innerText = "";
        }
      }
    }

    // 3. 音频逻辑
    const audio = document.getElementById('bgAudio');
    const audioBtn = document.getElementById('audioToggleBtn');
    if (LETTER_DATA.audioUrl) {
      audio.src = LETTER_DATA.audioUrl;
      audioBtn.style.display = 'flex';
    }

    audioBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        audioBtn.innerText = '🔊';
      } else {
        audio.pause();
        audioBtn.innerText = '🔇';
      }
    });

    // 4. 信封开启逻辑
    const container = document.getElementById('letterContainer');
    const envelope = document.getElementById('envelopeWrapper');
    envelope.addEventListener('click', () => {
      container.classList.add('is-opened');
      if (LETTER_DATA.audioUrl) {
        audio.play().catch(() => {});
      }
      if (LETTER_DATA.enableScratch) {
        initScratchCard();
      }
    });

    // 5. 真实物理刮刮乐
    function initScratchCard() {
      const canvas = document.getElementById('scratchCanvas');
      if (!canvas) return;
      const box = canvas.parentElement;
      const ctx = canvas.getContext('2d');
      const w = box.clientWidth || 320;
      const h = box.clientHeight || 76;
      canvas.width = w;
      canvas.height = h;

      // 金色渐变底漆
      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, '#c5a059');
      grad.addColorStop(0.5, '#ecd08c');
      grad.addColorStop(1, '#9e7d3b');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // 金属颗粒质感
      ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
      for (let i = 0; i < w; i += 4) {
        for (let j = 0; j < h; j += 4) {
          if (Math.random() > 0.6) ctx.fillRect(i, j, 1.5, 1.5);
        }
      }

      ctx.fillStyle = '#24272e';
      ctx.font = 'bold 12px Cinzel, serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('SCRATCH HERE ✦', w / 2, h / 2);

      let isScratching = false;
      function scratch(e) {
        if (!isScratching) return;
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(clientX - rect.left, clientY - rect.top, 16, 0, Math.PI * 2);
        ctx.fill();
      }

      canvas.addEventListener('mousedown', () => isScratching = true);
      window.addEventListener('mouseup', () => isScratching = false);
      canvas.addEventListener('mousemove', scratch);
      canvas.addEventListener('touchstart', (e) => { isScratching = true; scratch(e); }, { passive: true });
      window.addEventListener('touchend', () => isScratching = false);
      canvas.addEventListener('touchmove', scratch, { passive: true });
    }

    // 6. 调皮逃跑按钮交互
    const btnNo = document.getElementById('btnNo');
    const btnYes = document.getElementById('btnYes');
    const modal = document.getElementById('runawaySuccessModal');

    function runaway() {
      const x = (Math.random() - 0.5) * 200;
      const y = (Math.random() - 0.5) * 120;
      btnNo.style.transform = `translate(${x}px, ${y}px)`;
    }
    btnNo.addEventListener('mouseover', runaway);
    btnNo.addEventListener('touchstart', (e) => { e.preventDefault(); runaway(); });

    btnYes.addEventListener('click', () => {
      modal.style.display = 'block';
      btnNo.style.display = 'none';
      btnYes.style.transform = 'scale(1.1)';
    });

    // 7. 金箔浮尘粒子 (gold-dust)
    const pCanvas = document.getElementById('particle-canvas');
    const pCtx = pCanvas.getContext('2d');
    let particles = [];
    function resizeP() {
      pCanvas.width = window.innerWidth;
      pCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeP);
    resizeP();

    for (let i = 0; i < 40; i++) {
      particles.push({
        x: Math.random() * pCanvas.width,
        y: Math.random() * pCanvas.height,
        size: Math.random() * 2 + 0.8,
        speedY: Math.random() * 0.6 + 0.3,
        speedX: (Math.random() - 0.5) * 0.4,
        opacity: Math.random() * 0.7 + 0.3
      });
    }

    function loopParticles() {
      pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
      pCtx.fillStyle = '#d4af37';
      particles.forEach(p => {
        p.y -= p.speedY;
        p.x += p.speedX;
        if (p.y < 0) {
          p.y = pCanvas.height + 10;
          p.x = Math.random() * pCanvas.width;
        }
        pCtx.globalAlpha = p.opacity;
        pCtx.beginPath();
        pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        pCtx.fill();
      });
      requestAnimationFrame(loopParticles);
    }
    loopParticles();
  </script>
</body>
</html>
