<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>A Letter For You</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="core.css" />
  <link rel="stylesheet" href="theme-kintsugi.css" />
</head>
<body>

  <!-- 背景粒子画布 (常态星尘 + 开信星芒冲击波爆破) -->
  <canvas id="particle-canvas"></canvas>

  <audio id="bgAudio" loop preload="auto"></audio>
  <button class="audio-toggle-btn" id="audioToggleBtn" title="Toggle Music" style="display:none;">🔊</button>

  <!-- 密码锁系统 -->
  <div class="passcode-overlay" id="passcodeOverlay">
    <div class="passcode-box">
      <div class="passcode-title">ENTER 4-DIGIT PASSCODE</div>
      <div class="passcode-inputs">
        <input type="password" maxlength="1" class="passcode-digit" autofocus />
        <input type="password" maxlength="1" class="passcode-digit" />
        <input type="password" maxlength="1" class="passcode-digit" />
        <input type="password" maxlength="1" class="passcode-digit" />
      </div>
      <div class="passcode-error" id="passcodeError"></div>
    </div>
  </div>

  <div class="letter-viewport" data-theme="kintsugi">
    <div class="letter-container" id="letterContainer">
      
      <!-- 1. 高定金缮信封 (烫金双边，典雅无杂线) -->
      <div class="envelope-wrapper" id="envelopeWrapper">
        <div class="envelope-body"></div>

        <!-- 平缓舒展的 V 型翻盖 -->
        <div class="envelope-flap"></div>

        <!-- 金缮心愈手工火漆印 -->
        <div class="wax-seal-wrapper">
          <div class="wax-seal" id="waxSealBtn">
            <svg class="seal-heart-svg" viewBox="0 0 24 24">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
          </div>
        </div>

        <div class="envelope-open-hint">✦ TAP SEAL TO UNSEAL ✦</div>
      </div>

      <!-- 2. 和解信纸主体 -->
      <article class="letter-sheet" id="letterSheet">
        <!-- 顶端和解公文标章 -->
        <div class="apology-badge-header">
          <span class="apology-badge-pill">✦ OFFICIAL PEACE OFFERING & RECONCILIATION ✦</span>
        </div>

        <div class="letter-date" id="letterDate"></div>
        <h1 class="letter-title" id="letterHeadline"></h1>
        <div class="letter-salutation" id="letterSalutation"></div>

        <!-- 3D 翻转相册 (照片居于正文之前，先唤起真挚回忆) -->
        <div class="photos-section" id="photosSection">
          <div class="photo-flip-card" id="photoCard">
            <div class="photo-flip-inner">
              <div class="photo-card-front">
                <img id="frontPhotoImg" src="" alt="Memory Photo" />
              </div>
              <div class="photo-card-back">
                <p class="photo-caption-text" id="backCaptionText"></p>
              </div>
            </div>
          </div>
          <div class="photo-flip-hint">✦ TAP PHOTO TO FLIP OVER ✦</div>
        </div>

        <!-- 道歉与和解真心兑换券 (Apology Promise Tokens) -->
        <div class="apology-tokens-wrapper">
          <div class="apology-token">🕊 Patient Listening</div>
          <div class="apology-token">♡ Unlimited Warm Hugs</div>
          <div class="apology-token">🍽️ Favorite Comfort Meal</div>
        </div>

        <!-- 智能语速打字机长信 (支持轻点全屏立即跳过) -->
        <div class="letter-body-text" id="letterBody">
          <span id="typewriterText"></span><span class="typewriter-cursor" id="typewriterCursor"></span>
        </div>

        <div class="letter-closing" id="letterClosing"></div>

        <!-- 金继裂纹瓷板刮刮乐 -->
        <div class="scratch-component" id="scratchComponent">
          <div class="scratch-hint-text" id="scratchHintText">✦ POLISH THE GOLDEN SEAM TO HEAL ✦</div>
          <div class="scratch-card-box">
            <div class="scratch-secret-reveal" id="scratchSecretReveal"></div>
            <canvas class="scratch-canvas" id="scratchCanvas"></canvas>
          </div>
        </div>

        <!-- 调皮逃跑按钮问答 -->
        <div class="runaway-section" id="runawaySection">
          <div class="runaway-question" id="runawayQuestion"></div>
          <div class="runaway-buttons-wrapper">
            <button class="btn-yes" id="btnYes">Yes ♡</button>
            <button class="btn-no" id="btnNo">No</button>
          </div>
          <div class="runaway-success-modal" id="runawaySuccessModal"></div>
        </div>
      </article>

    </div>
  </div>

  <script src="data.js"></script>

  <script>
    document.getElementById('letterDate').innerText = LETTER_DATA.dateText || '';
    document.getElementById('letterHeadline').innerText = LETTER_DATA.headline || "I'M TRULY SORRY";
    document.getElementById('letterSalutation').innerText = LETTER_DATA.salutation || '';
    document.getElementById('letterClosing').innerText = LETTER_DATA.closing || '';

    // 照片卡
    if (LETTER_DATA.photos && LETTER_DATA.photos.length > 0) {
      document.getElementById('frontPhotoImg').src = LETTER_DATA.photos[0].url;
      document.getElementById('backCaptionText').innerText = LETTER_DATA.photos[0].caption;
      document.getElementById('photoCard').addEventListener('click', function(e) {
        e.stopPropagation();
        this.classList.toggle('is-flipped');
      });
    } else {
      document.getElementById('photosSection').style.display = 'none';
    }

    // 刮刮乐
    if (!LETTER_DATA.enableScratch) {
      document.getElementById('scratchComponent').style.display = 'none';
    } else {
      document.getElementById('scratchSecretReveal').innerText = LETTER_DATA.scratchSecret;
    }

    // 逃跑问答
    if (!LETTER_DATA.enableRunaway) {
      document.getElementById('runawaySection').style.display = 'none';
    } else {
      document.getElementById('runawayQuestion').innerText = LETTER_DATA.runawayQuestion;
      document.getElementById('runawaySuccessModal').innerText = LETTER_DATA.runawaySuccessMessage;
    }

    // 密码锁
    const overlay = document.getElementById('passcodeOverlay');
    if (!LETTER_DATA.passcode) {
      overlay.classList.add('is-unlocked');
    } else {
      const inputs = document.querySelectorAll('.passcode-digit');
      const errorEl = document.getElementById('passcodeError');
      inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
          if (e.target.value.length === 1 && index < inputs.length - 1) inputs[index + 1].focus();
          checkPasscode();
        });
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !e.target.value && index > 0) inputs[index - 1].focus();
        });
      });
      function checkPasscode() {
        let entered = Array.from(inputs).map(i => i.value).join('');
        if (entered.length === 4) {
          if (entered === LETTER_DATA.passcode) {
            overlay.classList.add('is-unlocked');
          } else {
            errorEl.innerText = "Incorrect passcode. Try again.";
            inputs.forEach(i => i.value = '');
            inputs[0].focus();
          }
        }
      }
    }

    // 背景音频
    const audio = document.getElementById('bgAudio');
    const audioBtn = document.getElementById('audioToggleBtn');
    if (LETTER_DATA.audioUrl) {
      audio.src = LETTER_DATA.audioUrl;
      audioBtn.style.display = 'flex';
    }
    audioBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (audio.paused) { audio.play(); audioBtn.innerText = '🔊'; }
      else { audio.pause(); audioBtn.innerText = '🔇'; }
    });

    // 核心开信特效：触发冲击波光效 + 金芒星星爆破
    const container = document.getElementById('letterContainer');
    const envelope = document.getElementById('envelopeWrapper');
    let isLetterOpened = false;

    envelope.addEventListener('click', (e) => {
      if (isLetterOpened) return;
      isLetterOpened = true;

      // 触发金光与四角芒星爆破
      createGoldenUnsealBurst(window.innerWidth / 2, window.innerHeight / 2);

      setTimeout(() => {
        container.classList.add('is-opened');
        if (LETTER_DATA.audioUrl) audio.play().catch(() => {});
        if (LETTER_DATA.enableScratch) initScratchCard();
        startSmartTypewriter(LETTER_DATA.body);
      }, 400);
    });

    // 智能语速打字机
    let typewriterTimer = null;
    let isTypingFinished = false;
    const textContainer = document.getElementById('typewriterText');
    const cursor = document.getElementById('typewriterCursor');

    function startSmartTypewriter(fullText) {
      if (!fullText) return;
      let currentIndex = 0;
      const totalLen = fullText.length;

      let typingSpeed = 35;
      if (totalLen > 500) typingSpeed = 10;
      else if (totalLen > 250) typingSpeed = 18;

      typewriterTimer = setInterval(() => {
        if (currentIndex < totalLen) {
          textContainer.innerText += fullText.charAt(currentIndex);
          currentIndex++;
        } else {
          finishTyping(fullText);
        }
      }, typingSpeed);

      document.addEventListener('click', function onSkipClick() {
        if (!isTypingFinished) {
          finishTyping(fullText);
          document.removeEventListener('click', onSkipClick);
        }
      });
    }

    function finishTyping(fullText) {
      clearInterval(typewriterTimer);
      textContainer.innerText = fullText;
      isTypingFinished = true;
      cursor.style.display = 'none';
    }

    // 金继瓷板刮刮乐
    function initScratchCard() {
      const canvas = document.getElementById('scratchCanvas');
      if (!canvas) return;
      const box = canvas.parentElement;
      const ctx = canvas.getContext('2d');
      const w = box.clientWidth || 320;
      const h = box.clientHeight || 76;
      canvas.width = w;
      canvas.height = h;

      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, '#d4af37');
      grad.addColorStop(0.3, '#fbf0cd');
      grad.addColorStop(0.7, '#c5a059');
      grad.addColorStop(1, '#8f6c18');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
      for (let i = 0; i < w; i += 3) {
        for (let j = 0; j < h; j += 3) {
          if (Math.random() > 0.65) ctx.fillRect(i, j, 1.2, 1.2);
        }
      }

      ctx.fillStyle = '#221e18';
      ctx.font = 'bold 11px Cinzel, serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.letterSpacing = '2.5px';
      ctx.fillText('✦ POLISH HERE ✦', w / 2, h / 2);

      let isScratching = false;
      function scratch(e) {
        if (!isScratching) return;
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(clientX - rect.left, clientY - rect.top, 18, 0, Math.PI * 2);
        ctx.fill();
      }

      canvas.addEventListener('mousedown', () => isScratching = true);
      window.addEventListener('mouseup', () => isScratching = false);
      canvas.addEventListener('mousemove', scratch);
      canvas.addEventListener('touchstart', (e) => { isScratching = true; scratch(e); }, { passive: true });
      window.addEventListener('touchend', () => isScratching = false);
      canvas.addEventListener('touchmove', scratch, { passive: true });
    }

    // 逃跑问答
    const btnNo = document.getElementById('btnNo');
    const btnYes = document.getElementById('btnYes');
    const modal = document.getElementById('runawaySuccessModal');

    function runaway(e) {
      e.stopPropagation();
      const x = (Math.random() - 0.5) * 220;
      const y = (Math.random() - 0.5) * 130;
      btnNo.style.transform = `translate(${x}px, ${y}px)`;
    }
    btnNo.addEventListener('mouseover', runaway);
    btnNo.addEventListener('touchstart', (e) => { e.preventDefault(); runaway(e); });

    btnYes.addEventListener('click', (e) => {
      e.stopPropagation();
      modal.style.display = 'block';
      btnNo.style.display = 'none';
      btnYes.style.transform = 'scale(1.1)';
      createGoldenUnsealBurst(window.innerWidth / 2, window.innerHeight * 0.7);
    });

    // 物理粒子引擎：常态浮尘 + 专属金光闪烁四角芒星 + 冲击波
    const pCanvas = document.getElementById('particle-canvas');
    const pCtx = pCanvas.getContext('2d');
    let floatingDust = [];
    let sparkleStars = [];
    let shockwaves = [];

    function resizeCanvas() {
      pCanvas.width = window.innerWidth;
      pCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < 35; i++) {
      floatingDust.push({
        x: Math.random() * pCanvas.width,
        y: Math.random() * pCanvas.height,
        size: Math.random() * 2 + 0.6,
        speedY: Math.random() * 0.4 + 0.2,
        speedX: (Math.random() - 0.5) * 0.3,
        opacity: Math.random() * 0.6 + 0.2
      });
    }

    // 绘制真实四角芒星 (✦)
    function drawFourPointStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
      let rot = (Math.PI / 2) * 3;
      let x = cx;
      let y = cy;
      let step = Math.PI / spikes;

      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;

        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
      ctx.fill();
    }

    // 专属开信爆破特效
    function createGoldenUnsealBurst(originX, originY) {
      // 1. 金色光晕冲击波
      shockwaves.push({
        x: originX,
        y: originY,
        radius: 10,
        maxRadius: 280,
        opacity: 0.95,
        lineWidth: 6
      });

      // 2. 喷薄而出的四角芒星与流金火花
      for (let i = 0; i < 45; i++) {
        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * 9 + 4;
        sparkleStars.push({
          x: originX,
          y: originY,
          vx: Math.cos(angle) * velocity,
          vy: Math.sin(angle) * velocity,
          size: Math.random() * 7 + 4,
          color: Math.random() > 0.3 ? '#ffeaa7' : '#ffd700',
          life: 1,
          decay: Math.random() * 0.025 + 0.015,
          rot: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 10
        });
      }
    }

    function renderLoop() {
      pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);

      // 1. 常态漂浮金尘
      pCtx.fillStyle = '#d4af37';
      floatingDust.forEach(p => {
        p.y -= p.speedY;
        p.x += p.speedX;
        if (p.y < 0) {
          p.y = pCanvas.height + 10;
          p.x = Math.random() * pCanvas.width;
        }
        pCtx.globalAlpha = p.opacity;
        pCtx.beginPath();
        pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        pCtx.fill();
      });

      // 2. 渲染冲击波
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.radius += (sw.maxRadius - sw.radius) * 0.12;
        sw.opacity -= 0.035;

        if (sw.opacity <= 0) {
          shockwaves.splice(i, 1);
          continue;
        }

        pCtx.save();
        pCtx.beginPath();
        pCtx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
        pCtx.strokeStyle = `rgba(255, 234, 167, ${sw.opacity})`;
        pCtx.lineWidth = sw.lineWidth;
        pCtx.shadowColor = '#ffd700';
        pCtx.shadowBlur = 20;
        pCtx.stroke();
        pCtx.restore();
      }

      // 3. 渲染旋转闪烁的四角芒星
      for (let i = sparkleStars.length - 1; i >= 0; i--) {
        const s = sparkleStars[i];
        s.x += s.vx;
        s.y += s.vy;
        s.vy += 0.12; // 微弱重力
        s.life -= s.decay;
        s.rot += s.rotSpeed;

        if (s.life <= 0) {
          sparkleStars.splice(i, 1);
          continue;
        }

        pCtx.save();
        pCtx.globalAlpha = s.life;
        pCtx.translate(s.x, s.y);
        pCtx.rotate((s.rot * Math.PI) / 180);
        pCtx.fillStyle = s.color;
        pCtx.shadowColor = '#ffeaa7';
        pCtx.shadowBlur = 8;
        drawFourPointStar(pCtx, 0, 0, 4, s.size, s.size * 0.35);
        pCtx.restore();
      }

      requestAnimationFrame(renderLoop);
    }
    renderLoop();
  </script>
</body>
</html>
